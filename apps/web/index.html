<!DOCTYPE html>
<html lang="en-GB" data-theme="noche">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una Mesa — Reserve Your Table at London's Best Restaurants</title>
<meta name="description" content="Browse video menus and reserve your table at London's best independent restaurants. Fully refundable deposit.">
<link rel="canonical" href="https://unamesa.co.uk/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,600;0,700;0,800;0,900;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"SoftwareApplication","name":"Una Mesa","url":"https://unamesa.co.uk","applicationCategory":"BusinessApplication","operatingSystem":"Web","description":"Una Mesa is a London restaurant discovery and reservation platform with video menus. Diners watch short videos of every dish before visiting, and book with a fully refundable deposit to secure their table.","offers":{"@type":"Offer","price":"0","priceCurrency":"GBP","description":"Free for diners. Restaurants pay a monthly listing fee."},"featureList":["Video menu — watch every dish before you visit","Table reservation with refundable deposit","London restaurant listings","QR code video menus for restaurant tables"],"provider":{"@type":"Organization","name":"Una Mesa","url":"https://unamesa.co.uk"},"areaServed":{"@type":"City","name":"London","addressCountry":"GB"}}
</script>
<link rel="stylesheet" href="https://app.unamesa.co.uk/app/app.css">
<style>
  #um-hero-shell {
    position: fixed; inset: 0; z-index: 9999;
    background: #0d0c0b;
    display: flex; flex-direction: column;
    transition: opacity 0.4s ease;
  }
  #um-hero-shell.hidden { opacity: 0; pointer-events: none; }

  .um-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px;
    background: rgba(13,12,11,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    position: relative; z-index: 2;
  }
  .um-brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 800; font-size: 20px;
    color: #F4EFE6; letter-spacing: -0.01em;
  }
  .um-brand span { color: #D8552E; }
  .um-nav-links { display: flex; gap: 28px; align-items: center; }
  .um-nav-links a {
    color: rgba(244,239,230,0.7);
    font-family: 'Manrope', sans-serif;
    font-size: 14px; font-weight: 600;
    text-decoration: none; transition: color 0.2s;
  }
  .um-nav-links a:hover { color: #F4EFE6; }
  .um-btn-outline {
    border: 1px solid rgba(244,239,230,0.3) !important;
    border-radius: 999px; padding: 8px 20px;
    color: #F4EFE6 !important; font-size: 13px !important;
  }
  .um-btn-solid {
    background: #D8552E; color: #fff !important;
    border-radius: 999px; padding: 8px 20px;
    font-size: 13px !important; font-weight: 700 !important;
  }

  .um-hero-bg { flex: 1; position: relative; overflow: hidden; }
  .um-hero-bg::before {
    content: '';
    position: absolute; inset: 0;
    background: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1600&q=80') center/cover no-repeat;
    animation: heroZoom 8s ease-out forwards;
  }
  @keyframes heroZoom {
    from { transform: scale(1.04); }
    to   { transform: scale(1.00); }
  }
  .um-hero-bg::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(13,12,11,0.35) 0%, rgba(13,12,11,0.6) 60%, rgba(13,12,11,0.92) 100%);
  }

  .um-hero-content {
    position: absolute; inset: 0; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 24px 60px; text-align: center;
  }
  .um-eyebrow {
    font-family: 'Manrope', sans-serif;
    font-size: 11px; font-weight: 800;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: #D8552E; margin-bottom: 18px;
  }
  .um-hero-h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(40px, 6vw, 80px);
    font-weight: 700; line-height: 1.05;
    color: #F4EFE6; letter-spacing: -0.02em;
  }
  .um-hero-h1 em { font-style: italic; color: #D8552E; }

  .um-search-wrap { width: 100%; max-width: 600px; margin-top: 36px; }
  .um-search-bar {
    display: flex; align-items: center;
    background: rgba(244,239,230,0.10);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(244,239,230,0.2);
    border-radius: 999px;
    padding: 6px 6px 6px 22px; gap: 8px;
  }
  .um-search-bar input {
    flex: 1; background: none; border: none; outline: none;
    font-family: 'Manrope', sans-serif;
    font-size: 15px; color: #F4EFE6; padding: 10px 0;
  }
  .um-search-bar input::placeholder { color: rgba(244,239,230,0.5); }
  .um-search-bar button {
    background: #D8552E; color: #fff;
    border: none; border-radius: 999px;
    padding: 11px 24px;
    font-family: 'Manrope', sans-serif;
    font-size: 14px; font-weight: 700;
    cursor: pointer; transition: opacity 0.2s;
  }
  .um-search-bar button:hover { opacity: 0.88; }

  .um-pills {
    display: flex; gap: 8px; flex-wrap: wrap;
    justify-content: center; margin-top: 16px;
  }
  .um-pill {
    background: rgba(244,239,230,0.08);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(244,239,230,0.15);
    border-radius: 999px; padding: 7px 16px;
    font-family: 'Manrope', sans-serif;
    font-size: 13px; font-weight: 600;
    color: rgba(244,239,230,0.85);
    cursor: pointer; transition: all 0.2s;
  }
  .um-pill:hover {
    background: rgba(216,85,46,0.2);
    border-color: rgba(216,85,46,0.5);
    color: #F4EFE6;
  }

  @media (max-width: 640px) {
    .um-nav { padding: 14px 20px; }
    .um-nav-links { gap: 12px; }
  }
</style>
</head>
<body>

<div id="um-hero-shell">
  <nav class="um-nav">
    <span class="um-brand">Una <span>Mesa</span></span>
    <div class="um-nav-links">
      <a href="#" onclick="umPillSearch('');return false;">Discover</a>
      <a href="#" onclick="umNav('concierge');return false;">AI Concierge</a>
      <a href="#" class="um-btn-outline" onclick="umNav('signin');return false;">Sign in</a>
      <a href="#" class="um-btn-solid" onclick="umNav('signup');return false;">Create profile</a>
    </div>
  </nav>
  <div class="um-hero-bg">
    <div class="um-hero-content">
      <p class="um-eyebrow">Book near you</p>
      <h1 class="um-hero-h1">The table that <em>awaits</em><br>you.</h1>
      <div class="um-search-wrap">
        <form class="um-search-bar" onsubmit="umHeroSearch(event)">
          <input id="um-search-input" type="text" placeholder="Restaurant, cuisine, area…" autocomplete="off">
          <button type="submit">Search</button>
        </form>
        <div class="um-pills">
          <button class="um-pill" onclick="umPillSearch('Outdoor seating')">Outdoor seating</button>
          <button class="um-pill" onclick="umPillSearch('Romantic')">Romantic</button>
          <button class="um-pill" onclick="umPillSearch('Seafood')">Seafood</button>
          <button class="um-pill" onclick="umPillSearch('Groups')">Groups</button>
          <button class="um-pill" onclick="umPillSearch('Brunch')">Brunch</button>
          <button class="um-pill" onclick="umPillSearch('Vegetarian')">Vegetarian</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>window.useState=React.useState;window.useEffect=React.useEffect;window.useRef=React.useRef;</script>
<script src="https://app.unamesa.co.uk/image-slot.js"></script>
<script src="https://js.stripe.com/v3/"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://app.unamesa.co.uk/app/data.js"></script>
<script src="https://app.unamesa.co.uk/app/auth.js"></script>
<script src="https://app.unamesa.co.uk/app/compiled/components.js"></script>
<script src="https://app.unamesa.co.uk/app/compiled/home.js"></script>
<script src="https://app.unamesa.co.uk/app/compiled/results.js"></script>
<script src="https://app.unamesa.co.uk/app/compiled/detail.js"></script>
<script src="https://app.unamesa.co.uk/app/compiled/booking.js"></script>
<script src="https://app.unamesa.co.uk/app/compiled/concierge.js"></script>
<script src="https://app.unamesa.co.uk/app/compiled/reserve-auth.js"></script>
<script src="https://app.unamesa.co.uk/app/compiled/profile-extras.js"></script>
<script src="https://app.unamesa.co.uk/app/compiled/profile.js"></script>
<script src="https://app.unamesa.co.uk/app/compiled/app.js"></script>

<script>
  if (!localStorage.getItem('um-theme')) localStorage.setItem('um-theme', 'noche');
  document.documentElement.setAttribute('data-theme', localStorage.getItem('um-theme') || 'noche');

  function hideHeroShell() {
    var shell = document.getElementById('um-hero-shell');
    if (shell) shell.classList.add('hidden');
  }
  function umHeroSearch(e) {
    e.preventDefault();
    var q = document.getElementById('um-search-input').value.trim();
    hideHeroShell();
    window.location.hash = q ? '#search/' + encodeURIComponent(q) : '#home';
  }
  function umPillSearch(q) {
    hideHeroShell();
    window.location.hash = q ? '#search/' + encodeURIComponent(q) : '#home';
  }
  function umNav(view) {
    hideHeroShell();
    window.location.hash = '#' + view;
  }

  var attempts = 0;
  var checkMounted = setInterval(function() {
    attempts++;
    var root = document.getElementById('root');
    if (root && root.children.length > 0) {
      clearInterval(checkMounted);
      setTimeout(hideHeroShell, 250);
    }
    if (attempts > 80) { clearInterval(checkMounted); hideHeroShell(); }
  }, 50);
</script>
</body>
</html>
