/* ── DARK THEME OVERRIDE — make noche the canonical look ── */
/* Force dark as the default (html[data-theme="noche"] rules from app.css apply) */
/* Additional brand overrides for the premium dark shell */
:root, [data-theme="noche"] {
  --accent: #D8552E;
  --accent-2: #e06840;
  --accent-soft: rgba(216,85,46,0.14);
  --accent-line: rgba(216,85,46,0.32);

  --glow: rgba(216,85,46,0.22);

}

/* ── HERO SECTION — premium marketing shell ── */
.um-hero {
  position: relative;
  min-height: 680px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.um-hero-bg {
  position: absolute;
  inset: 0;
  background: url('https://d8j0ntlcm91z4.cloudfront.net/user_3EEAzwZUvO4SvnS8Notm2hD9DNK/hf_20260926_110543_2a51e290-0934-4a45-a5f2-7916884c9998.png') center/cover no-repeat;
}
.um-hero-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(10,9,8,0.45) 0%, rgba(10,9,8,0.28) 40%, rgba(10,9,8,0.94) 100%);
}
.um-hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 100px 24px 80px;
  max-width: 800px;
  margin: 0 auto;
}
.um-hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 6px 16px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.9);
  margin-bottom: 28px;
}
.um-hero-eyebrow .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}
.um-hero h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(42px, 7vw, 82px);
  line-height: 1.02;
  letter-spacing: -0.02em;
  font-weight: 600;
  color: #fff;
  margin-bottom: 20px;
}
.um-hero h1 em { font-style: italic; }
.um-hero p.um-sub {
  color: rgba(255,255,255,0.68);
  font-size: 17px;
  line-height: 1.65;
  max-width: 500px;
  margin: 0 auto 40px;
  font-weight: 400;
}

/* ── HERO SEARCH (glassmorphism) ── */
.um-search-block {
  background: rgba(255,255,255,0.97);
  border-radius: 16px;
  padding: 6px;
  display: flex;
  align-items: center;
  max-width: 860px;
  margin: 0 auto 20px;
  box-shadow: 0 16px 60px rgba(0,0,0,0.5);
}
.um-search-field {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-right: 1px solid rgba(0,0,0,0.1);
  color: #1a1714;
}
.um-search-field.grow { flex: 2; }
.um-search-field.fixed { flex: 1; min-width: 130px; }
.um-search-field:last-of-type { border-right: none; }
.um-search-field svg { flex-shrink: 0; color: #888; }
.um-search-field input,
.um-search-field select {
  background: none;
  border: none;
  outline: none;
  font-family: 'Manrope', sans-serif;
  font-size: 14px;
  color: #1a1714;
  width: 100%;
  cursor: pointer;
}
.um-search-field input::placeholder { color: #999; }
.um-search-submit {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 14px 24px;
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.um-search-submit:hover { background: #b8431e; }
.um-filter-pills {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 16px;
}
.um-pill {
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,0.85);
  cursor: pointer;
  transition: background .15s;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Manrope', sans-serif;
  border: none;
}
.um-pill:hover { background: rgba(255,255,255,0.2); }

/* ── APP SHELL — hide hero once React mounts ── */
#um-hero-shell { transition: opacity 0.3s ease; }
#um-hero-shell.hidden { display: none; }

/* ── Adjust React app to sit below (no hero) ── */
#root { min-height: 100vh; }
#root .hdr { position: sticky; top: 0; }

/* ── Mobile responsive ── */
@media (max-width: 768px) {
  .um-search-block { flex-direction: column; border-radius: 12px; }
  .um-search-field { border-right: none; border-bottom: 1px solid rgba(0,0,0,0.08); width: 100%; }
  .um-search-field:last-of-type { border-bottom: none; }
  .um-search-submit { width: 100%; justify-content: center; border-radius: 8px; }
  .um-hero-content { padding: 80px 20px 60px; }
  .um-filter-pills { gap: 6px; }
}

<!-- HERO SHELL — visible before React boots, hidden after -->
<div id="um-hero-shell">

          <input type="text" placeholder="Date" readonly onfocus="this.type='date'" onblur="if(!this.value)this.type='text'" style="min-width:0">
        </div>
        <div class="um-search-field fixed">
          <span style="font-size:14px">👥</span>
          <select style="min-width:0"><option>2 guests</option><option>1 guest</option><option>3 guests</option><option>4 guests</option><option>5+ guests</option></select>
        </div>
        <div class="um-search-field fixed">

          <select style="min-width:0"><option>All cuisines</option><option>Italian</option><option>Japanese</option><option>Mediterranean</option><option>Turkish</option><option>Modern British</option></select>

        <button class="um-pill" onclick="umPillSearch('romantic')">Romantic</button>
        <button class="um-pill" onclick="umPillSearch('outdoor terrace')">Outdoor terrace</button>
        <button class="um-pill" onclick="umPillSearch('tasting menu')">Tasting menu</button>
        <button class="um-pill" onclick="umPillSearch('sunday brunch')">Sunday Brunch</button>
        <button class="um-pill" onclick="umPillSearch('hidden gem')">Hidden gem</button>

<script>
// ── HERO SEARCH HANDLERS ──
// The React app uses URL hash routing (#search/query, #concierge, etc.)
// We set the hash and hide the hero — React picks it up via its hashchange listener.

function umHeroSearch(e) {
  e.preventDefault();
  const q = document.getElementById('um-search-input').value.trim();
  hideHeroShell();
  if (q) {
    window.location.hash = '#search/' + encodeURIComponent(q);
  }
}

function umPillSearch(q) {
  hideHeroShell();
  window.location.hash = '#search/' + encodeURIComponent(q);
}

function hideHeroShell() {
  const shell = document.getElementById('um-hero-shell');
  if (shell) shell.classList.add('hidden');
}

// ── WAIT FOR REACT APP TO BOOT, THEN HIDE HERO ──
(function() {
  let attempts = 0;
  const checkMounted = setInterval(() => {
    attempts++;
    const root = document.getElementById('root');
    // React has rendered when it has child elements
    if (root && root.children.length > 0) {
      clearInterval(checkMounted);
      // Small delay so the home view is painted before hero disappears
      setTimeout(hideHeroShell, 250);
    }
    if (attempts > 80) clearInterval(checkMounted); // give up after 4s
  }, 50);
})();

// ── SERVICE WORKER (optional) ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    // Don't register SW here to avoid caching cross-origin app scripts
  });
}
</script>
