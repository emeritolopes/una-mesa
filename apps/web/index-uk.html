<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Browse video menus and reserve your table at London's best independent restaurants. Fully refundable deposit.">
<link rel="canonical" href="https://unamesa.co.uk/">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --accent: #D8552E;
    --bg: #0f0f0f;
    --bg-raised: #1a1a1a;
    --bg-card: #181818;
    --text: #F4EFE6;
    --text-dim: #a89f96;
    --border: rgba(255,255,255,0.08);
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, .brand {
    font-family: 'Playfair Display', Georgia, serif;
  }
  a { color: inherit; text-decoration: none; }

  header.top {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding: 20px 24px;
    background: rgba(15,15,15,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    font-weight: 800; font-size: 20px;
  }
  .brand span { color: var(--accent); }

  .hero {
    max-width: 720px;
    margin: 0 auto;
    padding: 72px 24px 40px;
    text-align: center;
  }
  .hero h1 {
    font-size: clamp(32px, 5vw, 52px);
    line-height: 1.1;
    letter-spacing: -0.01em;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .hero p.sub {
    color: var(--text-dim);
    font-size: 17px;
    line-height: 1.5;
    max-width: 480px;
    margin: 0 auto;
  }

  .searchbar {
    max-width: 560px;
    margin: 32px auto 0;
    padding: 0 24px;
  }
  .searchbar-inner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 6px 6px 20px;
  }
  .searchbar-inner input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 15px;
    padding: 12px 0;
  }
  .searchbar-inner input::placeholder { color: var(--text-dim); }
  .searchbar-inner button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }

  main.grid-wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }
  .grid-heading {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 24px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 24px;
  }

  .card {
    display: block;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: transform .2s ease, border-color .2s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: rgba(216,85,46,0.4); }
  .card-photo {
    aspect-ratio: 4 / 3;
    background: #262220 no-repeat center / cover;
    position: relative;
  }
  .card-price {
    position: absolute; top: 10px; right: 10px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    color: #fff;
    font-size: 12px; font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .card-body { padding: 16px 18px 18px; }
  .card-name {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .card-meta {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 10px;
    text-transform: capitalize;
  }
  .card-rating {
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 700;
  }
  .card-rating .star { color: var(--accent); }
  .card-rating .count { color: var(--text-dim); font-weight: 400; }

  .state-msg {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 24px;
    grid-column: 1 / -1;
  }

  footer.foot {
    border-top: 1px solid var(--border);
    padding: 40px 24px;
  }
  .foot-in {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .foot-links { display: flex; gap: 24px; }
  .foot-links a:hover { color: var(--accent); }

  @media (max-width: 640px) {
    .hero { padding: 56px 20px 32px; }
    main.grid-wrap { padding: 40px 20px 60px; }
    .foot-in { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<header class="top">
  <span class="brand">Una <span>Mesa</span></span>
</header>

<section class="hero">
  <h1>The table that awaits you.</h1>
  <p class="sub">Reserve at London's best independent restaurants.</p>
</section>

<div class="searchbar">
  <form class="searchbar-inner" onsubmit="return false;">
    <input type="text" placeholder="Restaurant, cuisine or area…" aria-label="Search restaurants">
    <button type="submit">Search</button>
  </form>
</div>

<main class="grid-wrap">
  <div class="grid-heading">London restaurants</div>
  <div class="grid" id="venue-grid">
    <p class="state-msg">Loading restaurants…</p>
  </div>
</main>

<footer class="foot">
  <div class="foot-in">
    <span>© 2026 Una Mesa · The table that always awaits you</span>
    <div class="foot-links">
      <a href="#">Are you a restaurant?</a>
      <a href="#">Help</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
    </div>
  </div>
</footer>

<script>
const SUPABASE_URL = 'https://rkaytcmyaaighozxatod.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrYXl0Y215YWFpZ2hvenhhdG9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NDU2NDIsImV4cCI6MjA5NjQyMTY0Mn0.8zgAxW2q6JU_PySTQHBfBUHpxlDnz9UVLr6jm981x3s';

async function sbSelect(table, query) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    if (!res.ok) return [];
    return res.json();
  } catch (e) {
    return null;
  }
}

function priceLabel(priceRange) {
  const n = Math.max(1, Math.min(4, priceRange || 2));
  return '£'.repeat(n);
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s == null ? '' : String(s);
  return div.innerHTML;
}

function renderVenues(venues) {
  const grid = document.getElementById('venue-grid');

  if (venues === null) {
    grid.innerHTML = '<p class="state-msg">Couldn\'t load restaurants right now — please try again in a moment.</p>';
    return;
  }
  if (venues.length === 0) {
    grid.innerHTML = '<p class="state-msg">No restaurants listed yet — check back soon.</p>';
    return;
  }

  grid.innerHTML = venues.map(v => {
    const photo = (v.photo_urls && v.photo_urls[0]) || '';
    const metaParts = [v.cuisine, v.neighborhood].filter(Boolean);
    const rating = v.rating != null ? Number(v.rating).toFixed(1) : null;
    const detailUrl = `https://app.unamesa.co.uk/#detail/${v.id}`;

    return `
      <a class="card" href="${detailUrl}">
        <div class="card-photo" style="${photo ? `background-image:url('${photo.replace(/'/g, "%27")}')` : ''}">
          <span class="card-price">${priceLabel(v.price_range)}</span>
        </div>
        <div class="card-body">
          <div class="card-name">${escapeHtml(v.name)}</div>
          ${metaParts.length ? `<div class="card-meta">${escapeHtml(metaParts.join(' · '))}</div>` : ''}
          ${rating ? `<div class="card-rating"><span class="star">★</span> ${rating} <span class="count">(${v.review_count || 0})</span></div>` : ''}
        </div>
      </a>
    `;
  }).join('');
}

async function init() {
  const venues = await sbSelect(
    'venues',
    'city=eq.London&archived=eq.false&select=id,name,slug,cuisine,neighborhood,rating,review_count,price_range,photo_urls'
  );
  renderVenues(venues);
}

init();
</script>

</body>
</html>
