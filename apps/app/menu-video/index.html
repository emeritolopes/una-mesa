async function sbSelect(table, query) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    if (!res.ok) return [];
    return res.json();
  } catch (e) {
    return null;
  }
}

  return window.location.hostname.endsWith('.co.uk') ? 'app.unamesa.co.uk' : 'app.unamesa.co';

function fmtTime(s) {
  if (!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${String(sec).padStart(2, '0')}`;
}

  bindPlayerEvents();

function bindFavShare() {
  document.getElementById('share-btn').addEventListener('click', shareDish);
  const favBtn = document.getElementById('fav-btn');
  const favIcon = document.getElementById('fav-icon');
  const favKey = `una-mesa-fav-${currentDish.id}`;
  const applyFavState = () => {
    const isFav = localStorage.getItem(favKey) === '1';
    favIcon.style.fontVariationSettings = isFav ? "'FILL' 1" : "'FILL' 0";
    favIcon.style.color = isFav ? 'rgb(255, 87, 51)' : '';
  };
  applyFavState();
  favBtn.addEventListener('click', () => {
    const isFav = localStorage.getItem(favKey) === '1';
    if (isFav) localStorage.removeItem(favKey); else localStorage.setItem(favKey, '1');
    applyFavState();
  });
  document.getElementById('scroll-menu-btn')?.addEventListener('click', () => {
    document.getElementById('cat-nav').scrollIntoView({ behavior: 'smooth' });
  });
}

function bindPlayerEvents() {
  const video = document.getElementById('hero-video');
  if (!video) return; // sin video real, se queda con la foto de fondo
  const playToggle = document.getElementById('play-toggle');
  const playIcon = document.getElementById('play-icon');
  const progressTrack = document.getElementById('progress-track');
  const progressFill = document.getElementById('progress-fill');
  const timeLabel = document.getElementById('time-label');
  const fullscreenBtn = document.getElementById('fullscreen-btn');

  const updateTime = () => {
    timeLabel.textContent = `${fmtTime(video.currentTime)} / ${fmtTime(video.duration)}`;
    progressFill.style.width = video.duration ? `${(video.currentTime / video.duration) * 100}%` : '0%';
  };
  const togglePlay = () => { video.paused ? video.play() : video.pause(); };

  video.addEventListener('loadedmetadata', () => {
    updateTime();
    const capEl = document.getElementById('duration-caption');
    if (capEl) capEl.textContent = `${fmtTime(video.duration)} min cinematic presentation`;
  });
  video.addEventListener('timeupdate', updateTime);
  video.addEventListener('play', () => { playIcon.textContent = 'pause'; });
  video.addEventListener('pause', () => { playIcon.textContent = 'play_arrow'; });
  video.addEventListener('click', togglePlay);
  playToggle.addEventListener('click', togglePlay);
  progressTrack.addEventListener('click', e => {
    const rect = progressTrack.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    if (isFinite(video.duration)) video.currentTime = pct * video.duration;
  });
  fullscreenBtn.addEventListener('click', () => { if (video.requestFullscreen) video.requestFullscreen(); });
}

function bindCarouselEvents() {
  const track = document.getElementById('carousel-track');
  if (!track) return;
  track.querySelectorAll('[data-dish]').forEach(card => {
    card.addEventListener('click', () => selectDish(card.dataset.dish));
  });
  track.addEventListener('wheel', evt => {
    evt.preventDefault();
    track.scrollLeft += evt.deltaY;
  });
  document.getElementById('car-left')?.addEventListener('click', () => track.scrollBy({ left: -320, behavior: 'smooth' }));
  document.getElementById('car-right')?.addEventListener('click', () => track.scrollBy({ left: 320, behavior: 'smooth' }));
}

function selectDish(dishId) {
  currentDish = ALL_VIDEOS.find(v => v.id === dishId);
  if (!currentDish) return;
  currentCategory = currentDish.category;
  const url = new URL(window.location);
  url.searchParams.set('dish', dishId);
  window.history.replaceState({}, '', url);
  renderCatNav();
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function init() {
  if (!venueId) { renderMessage('Missing restaurant.'); return; }
  document.getElementById('back-link').href = profileUrl();
  document.getElementById('book-link').href = bookUrl();

  const venues = await sbSelect('venues', `id=eq.${venueId}&select=id,name,menu_video_access`);
  if (venues === null) { renderMessage("Couldn't connect right now — please try again in a moment."); return; }
  VENUE = venues[0];
  if (!VENUE || !VENUE.menu_video_access) { renderMessage("This restaurant's video menu isn't available yet."); return; }

  document.title = `${VENUE.name} — Video Menu — Una Mesa`;

  ALL_VIDEOS = await sbSelect('menu_videos', `venue_id=eq.${venueId}&order=sort_order`);
  if (ALL_VIDEOS === null) { renderMessage("Couldn't load the menu right now — please try again in a moment."); return; }
  if (ALL_VIDEOS.length === 0) { renderMessage("This restaurant hasn't uploaded any dishes yet."); return; }

  const startDish = (requestedDishId && ALL_VIDEOS.find(v => v.id === requestedDishId)) || ALL_VIDEOS[0];
  selectDish(startDish.id);
}

init().catch(() => renderMessage('Something went wrong loading this page — please try again.'));

// Micro-interactions — con delegación de eventos, ya que el contenido se genera dinámicamente.
document.addEventListener('mousedown', e => { e.target.closest('a, button')?.classList.add('scale-95'); });
document.addEventListener('mouseup', e => { e.target.closest('a, button')?.classList.remove('scale-95'); });
document.addEventListener('mouseleave', e => { e.target.closest?.('a, button')?.classList.remove('scale-95'); }, true);
</script>
