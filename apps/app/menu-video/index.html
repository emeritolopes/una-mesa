<script>
  (function(){
    try {
      if (!document.startViewTransition) return;
      document.addEventListener('click', function(e){
        const a = e.target.closest('a[href]');
        if (!a || a.target === '_blank' || !a.href.startsWith(location.origin)) return;
        const dest = a.href;
        e.preventDefault();
        document.startViewTransition(() => { location.href = dest; });
      });
    } catch(_){}
  })();
</script>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
window.umLoadVideo = function(video) {
  if (video.dataset.umLoaded) return;
  video.dataset.umLoaded = '1';
  const src = video.dataset.src || video.src;
  if (!src) return;
  if (Hls.isSupported() && src.includes('.m3u8')) {
    const hls = new Hls({ startLevel: -1 });
    hls.loadSource(src);
    hls.attachMedia(video);
    video._hls = hls;
  } else {
    video.src = src;
  }
};
</script>

  if (VENUE && VENUE.category_order) {
    const saved = VENUE.category_order.split(',').map(s => s.trim()).filter(Boolean);
    return [...saved.filter(c => realCats.includes(c)), ...realCats.filter(c => !saved.includes(c))];
  }
  const extraCats = realCats.filter(c => !STANDARD_CATEGORIES.includes(c));
  return [...STANDARD_CATEGORIES.filter(c => realCats.includes(c)), ...extraCats];
}

function renderCatNav() {
  const cats = orderedCategories();
  const nav = document.getElementById('cat-nav');
  nav.innerHTML = cats.map(c => `<a href="#" data-cat="${c}" class="${c === currentCategory ? 'active' : ''}">${c}</a>`).join('');
  nav.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const cat = a.dataset.cat;
      const first = ALL_VIDEOS.find(v => v.category === cat);
      if (first) { selectDish(first.id); }
      else { currentCategory = cat; renderCatNav(); renderMessage(`No dishes in "${cat}" yet.`); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });
  });
}

function shareDish() {
  const shareText = `${currentDish.dish_name} — ${VENUE.name} — Una Mesa`;
  if (navigator.share) { navigator.share({ title: currentDish.dish_name, text: shareText, url: window.location.href }).catch(() => {}); }
  else { window.open(`https://wa.me/?text=${encodeURIComponent(shareText + '\n' + window.location.href)}`, '_blank', 'noopener'); }
}

const ICON_CAL   = `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
const ICON_SHARE = `<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`;

function renderStoryPanel() {
  const v = currentDish;
  const panel = document.getElementById('story-panel');
  if (!panel || !v) return;
  panel.innerHTML = `
    <div class="story-card">
      <div class="story-eyebrow">The Story — ${v.dish_name}</div>
      <blockquote class="story-quote">"${v.story_quote || DEMO_STORY_QUOTE}"</blockquote>
      <p class="story-body">${v.story_body || DEMO_STORY_BODY}</p>
      <div class="story-macros">
        <div class="macro-cell"><div class="macro-val">${v.carbs_g != null ? v.carbs_g+'g' : '—'}</div><div class="macro-label">Carbs</div></div>
        <div class="macro-cell"><div class="macro-val">${v.fats_g != null ? v.fats_g+'g' : '—'}</div><div class="macro-label">Fats</div></div>
        <div class="macro-cell"><div class="macro-val">${v.protein_g != null ? v.protein_g+'g' : '—'}</div><div class="macro-label">Protein</div></div>
      </div>
      <div class="story-actions">
        <a href="${bookUrl()}" class="btn-book">${ICON_CAL} Book a Table</a>
        <button id="share-btn" class="btn-share">${ICON_SHARE} Share</button>
      </div>
    </div>`;
  document.getElementById('share-btn')?.addEventListener('click', shareDish);
}

function renderPage() {
  const dishesInCategory = ALL_VIDEOS.filter(x => x.category === currentCategory);
  document.getElementById('content').innerHTML = `
    <div class="section-eyebrow">Video Menu</div>
    <div class="section-title">${currentCategory}</div>
    <div class="menu-layout">
      <div>
        <div class="cards-row-wrap">
          <div class="cards-row" id="cards-row">
            ${dishesInCategory.map(s => `
            <div class="dish-card" data-card="${s.id}" data-select="${s.id}">
              <div class="dish-card-media">
                ${s.video_url
                  ? `<video id="video-${s.id}" data-src="${s.video_url}" muted loop playsinline preload="none"${s.thumbnail_url ? ` poster="${s.thumbnail_url}"` : ''}></video>
                     <button class="play-overlay-btn" data-play="${s.id}" aria-label="Play"><div class="play-circle"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div></button>`
                  : `<div class="thumb-bg" style="background-image:url('${s.thumbnail_url || DEMO_HERO_PHOTO}');"></div>`}
                <span class="ai-preview-badge">AI preview</span>
                ${s.is_chefs_choice ? `<span class="chefs-choice-badge">Chef's Choice</span>` : ''}
              </div>
              <div class="dish-card-name">${s.dish_name}</div>
              ${s.subtitle ? `<div class="dish-card-subtitle">${s.subtitle}</div>` : ''}
            </div>`).join('')}
          </div>
          <button class="car-arrow left" id="car-left" aria-label="Scroll left"><div class="arrow-circle"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div></button>
          <button class="car-arrow right" id="car-right" aria-label="Scroll right"><div class="arrow-circle"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div></button>
        </div>
        <div class="carousel-dots" id="scroll-dots"></div>
      </div>
      <div><div class="story-panel" id="story-panel"></div></div>
    </div>`;
  renderStoryPanel();
  bindCardEvents();
}

function bindCardEvents() {
  const row = document.getElementById('cards-row');
  if (row) {
    const containerPadding = window.innerWidth <= 900 ? 48 : 380;
    const effectiveWidth = Math.min(window.innerWidth, 1240);
    const cardUnit = 216;
    const wholeCards = Math.max(1, Math.floor(Math.max(280, effectiveWidth - containerPadding) / cardUnit));
    row.style.width = (wholeCards * cardUnit - 16) + 'px';
  }
  const leftArrow = document.getElementById('car-left');
  const rightArrow = document.getElementById('car-right');
  leftArrow?.addEventListener('click', () => row.scrollBy({ left: -220, behavior: 'smooth' }));
  rightArrow?.addEventListener('click', () => row.scrollBy({ left: 220, behavior: 'smooth' }));
  const updateArrows = () => {
    if (!row || !leftArrow || !rightArrow) return;
    const maxScroll = row.scrollWidth - row.clientWidth;
    leftArrow.style.display = row.scrollLeft <= 10 ? 'none' : 'flex';
    rightArrow.style.display = row.scrollLeft >= maxScroll - 10 ? 'none' : 'flex';
  };
  if (row) { updateArrows(); row.addEventListener('scroll', updateArrows); }
  const cards = row ? Array.from(row.children) : [];
  const dotsWrap = document.getElementById('scroll-dots');
  if (dotsWrap && cards.length > 1) {
    dotsWrap.innerHTML = cards.map((_, i) => `<div class="carousel-dot${i === 0 ? ' active' : ''}"></div>`).join('');
    const dots = Array.from(dotsWrap.children);
    let st;
    row.addEventListener('scroll', () => {
      clearTimeout(st);
      st = setTimeout(() => {
        const cw = (cards[0]?.getBoundingClientRect().width || 200) + 16;
        const ai = Math.round(row.scrollLeft / cw);
        dots.forEach((d, i) => d.classList.toggle('active', i === Math.min(ai, dots.length - 1)));
      }, 80);
    });
  }
  document.querySelectorAll('[data-select]').forEach(el => {
    el.addEventListener('click', () => {
      const dish = ALL_VIDEOS.find(v => v.id === el.dataset.select);
      if (!dish) return;
      currentDish = dish;
      const url = new URL(window.location); url.searchParams.set('dish', dish.id); window.history.replaceState({}, '', url);
      renderStoryPanel();
    });
  });
  const videos = document.querySelectorAll('#cards-row video');
  videos.forEach(v => { v.muted = true; });
  function overlayFor(video) { return document.querySelector(`.play-overlay-btn[data-play="${video.id.replace('video-', '')}"]`); }
  videos.forEach(v => {
    v.addEventListener('play', () => { const b = overlayFor(v); if (b) b.style.display = 'none'; });
    v.addEventListener('pause', () => { const b = overlayFor(v); if (b) b.style.display = 'flex'; });
  });
  document.querySelectorAll('.play-overlay-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const video = document.getElementById('video-' + btn.dataset.play);
      if (!video) return;
      const wasPlaying = !video.paused;
      videos.forEach(v => { if (v !== video) v.pause(); });
      if (wasPlaying) video.pause();
      else { window.umLoadVideo(video); video.play().catch(() => {}); }
    });
  });
}

function selectDish(dishId) {
  currentDish = ALL_VIDEOS.find(v => v.id === dishId);
  if (!currentDish) return;
  currentCategory = currentDish.category;
  const url = new URL(window.location); url.searchParams.set('dish', dishId); window.history.replaceState({}, '', url);
  renderCatNav(); renderPage(); renderReelsHome(); stripAutoplayOnMobile();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateVenueSchema(venue) {
  const pageUrl = `https://app.unamesa.co.uk/menu-video/?venue=${venue.slug}`;
  const schema = { "@context": "https://schema.org", "@graph": [
    { "@type": "WebPage", "name": `${venue.name} — Video Menu | Una Mesa`, "url": pageUrl },
    { "@type": "FoodEstablishment", "name": venue.name, "url": pageUrl, "servesCuisine": venue.cuisine || "International", "address": { "@type": "PostalAddress", "addressLocality": venue.city || "London", "addressCountry": "GB" }, "hasMenu": pageUrl }
  ]};
  const el = document.getElementById("uma-venue-schema");
  if (el) el.textContent = JSON.stringify(schema);
}

function updatePageMeta(venue) {
  document.title = `${venue.name} — Video Menu | Una Mesa`;
  let desc = document.querySelector('meta[name="description"]');
  if (!desc) { desc = document.createElement("meta"); desc.name = "description"; document.head.appendChild(desc); }
  desc.content = `Watch video clips of every dish at ${venue.name} before you visit. Book your table on Una Mesa.`;
}

async function init() {
  if (!venueSlug) { renderMessage('Missing restaurant.'); return; }
  const venues = await sbSelect('venues', `slug=eq.${venueSlug}&select=id,name,slug,menu_video_access,category_order`);
  if (venues === null) { renderMessage("Couldn't connect right now."); return; }
  VENUE = venues[0];
  if (!VENUE || !VENUE.menu_video_access) { renderMessage("This restaurant's video menu isn't available yet."); return; }
  updateVenueSchema(VENUE); updatePageMeta(VENUE);
  venueId = VENUE.id;
  document.getElementById('back-link').href = bookUrl();
  document.getElementById('venue-name').textContent = VENUE.name;
  ALL_VIDEOS = await sbSelect('menu_videos', `venue_id=eq.${venueId}&order=sort_order`);
  if (ALL_VIDEOS === null) { renderMessage("Couldn't load the menu right now."); return; }
  if (ALL_VIDEOS.length === 0) { renderMessage("This restaurant hasn't uploaded any dishes yet."); return; }
  const startDish = (requestedDishId && ALL_VIDEOS.find(v => v.id === requestedDishId)) || ALL_VIDEOS[0];
  selectDish(startDish.id);
}
init().catch(() => renderMessage('Something went wrong — please try again.'));

(function initTheme() {
  const btn = document.getElementById('theme-toggle');
  const sun = document.getElementById('theme-icon-sun');
  const moon = document.getElementById('theme-icon-moon');
  const isLightNow = () => { try { return localStorage.getItem('um-theme') !== 'noche'; } catch(e) { return false; } };
  const applyTheme = () => {
    const isLight = isLightNow();
    document.documentElement.classList.toggle('light-mode', isLight);
    document.documentElement.classList.toggle('dark', !isLight);
    sun.style.display = isLight ? 'none' : 'block';
    moon.style.display = isLight ? 'block' : 'none';
  };
  applyTheme();
  btn.addEventListener('click', () => { try { localStorage.setItem('um-theme', isLightNow() ? 'noche' : 'crema'); } catch(e) {} applyTheme(); });
  window.addEventListener('storage', e => { if (e.key === 'um-theme') applyTheme(); });
})();

document.addEventListener('mousedown', e => { e.target.closest('a, button')?.classList.add('scale-95'); });
document.addEventListener('mouseup', e => { e.target.closest('a, button')?.classList.remove('scale-95'); });
document.addEventListener('mouseleave', e => { e.target.closest?.('a, button')?.classList.remove('scale-95'); }, true);
</script>

<script>
function reelsCategories() {
  const realCats = [...new Set(ALL_VIDEOS.map(v => v.category))];
  if (VENUE && VENUE.category_order) {
    const saved = VENUE.category_order.split(',').map(s => s.trim()).filter(Boolean);
    return [...saved.filter(c => realCats.includes(c)), ...realCats.filter(c => !saved.includes(c))];
  }
  return [...STANDARD_CATEGORIES.filter(c => realCats.includes(c)), ...realCats.filter(c => !STANDARD_CATEGORIES.includes(c))];
}
function stripAutoplayOnMobile() {
  if (window.innerWidth > 900) return;
  document.querySelectorAll('#content video[autoplay]').forEach(v => { v.removeAttribute('autoplay'); v.pause(); });
}
function reelsSlug(cat) { return 'reels-cat-' + cat.toLowerCase().replace(/[^a-z0-9]+/g, '-'); }
function reelsVideoTag(url, thumb) {
  if (!url) return `<div class="reels-card-video" style="background-image:url('${thumb || DEMO_HERO_PHOTO}');background-size:cover;background-position:center;position:absolute;inset:0;"></div>`;
  return `<video class="reels-card-video" data-src="${url}" muted loop playsinline preload="none"${thumb ? ` poster="${thumb}"` : ''}></video>`;
}
function renderReelsHome() {
  const view = document.getElementById('reels-view');
  if (!view || !VENUE || !ALL_VIDEOS.length) return;
  if (window.innerWidth > 900) { view.innerHTML = ''; return; }
  const cats = reelsCategories();
  const cards = cats.map(cat => {
    const dishes = ALL_VIDEOS.filter(v => v.category === cat);
    const first = dishes[0];
    const badge = dishes.length ? `${dishes.length} DISH${dishes.length === 1 ? '' : 'ES'}` : 'COMING SOON';
    return `
      <button data-reels-open="${reelsSlug(cat)}" class="reels-card-btn">
        ${first ? reelsVideoTag(first.video_url, first.thumbnail_url) : `<div style="position:absolute;inset:0;background:var(--um-surface);"></div>`}
        <div class="reels-card-overlay"></div>
        ${first ? `<span class="ai-preview-badge">AI preview</span>` : ''}
        <div class="reels-card-body">
          <div class="reels-category-badge">${badge}</div>
          <div class="reels-card-title">${cat}</div>
        </div>
      </button>`;
  }).join('');
  const overlays = cats.map(cat => {
    const dishes = ALL_VIDEOS.filter(v => v.category === cat);
    const slug = reelsSlug(cat);
    if (!dishes.length) return `
      <div class="reels-empty-state" id="${slug}">
        <button data-reels-close="${slug}" class="reels-back-btn" style="position:absolute;top:16px;left:16px;"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
        <div class="section-title">${cat} — coming soon</div>
        <p style="color:var(--um-text-muted);max-width:280px;font-size:14px;">No videos in this category yet.</p>
      </div>`;
    const slides = dishes.map(d => `
      <section class="reels-snap-item" data-reels-dish="${d.id}">
        ${d.video_url ? `<video data-src="${d.video_url}" muted loop playsinline preload="none"${d.thumbnail_url ? ` poster="${d.thumbnail_url}"` : ''}></video>` : `<div style="position:absolute;inset:0;background-image:url('${d.thumbnail_url || DEMO_HERO_PHOTO}');background-size:cover;background-position:center;"></div>`}
        <div class="reels-gradient"></div>
        <span class="ai-preview-badge">AI preview</span>
        <div class="reels-item-info">
          <div class="reels-item-text">
            ${d.is_chefs_choice ? `<span class="chefs-choice-badge" style="position:relative;bottom:auto;left:auto;margin-bottom:10px;display:inline-block;">Chef's Choice</span><br>` : ''}
            <div class="reels-item-name">${d.dish_name}</div>
            ${d.subtitle ? `<div class="reels-item-subtitle">${d.subtitle}</div>` : ''}
            <div class="reels-item-story">${d.story_body || DEMO_STORY_BODY}</div>
          </div>
          <div class="reels-side-btns">
            <a href="${bookUrl()}" class="reels-icon-btn" aria-label="Book"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></a>
            <button data-reels-share="${d.id}" class="reels-icon-btn" aria-label="Share"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></button>
          </div>
        </div>
        <div class="reels-book-bar"><a href="${bookUrl()}" class="reels-book-btn">Reserve a table</a></div>
      </section>`).join('');
    return `
      <div class="reels-cat-overlay" id="${slug}" style="display:none;">
        <div class="reels-overlay-nav">
          <button data-reels-close="${slug}" class="reels-back-btn"><svg viewBox="0 0 24 24" width="20" height="20" stroke="#fff" fill="none" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
          <div class="reels-progress-rail"></div>
        </div>
        <main class="reels-snap-container" data-reels-feed="${slug}">${slides}</main>
      </div>`;
  }).join('');
  view.innerHTML = `
    <div style="padding: calc(var(--nav-h) + 24px) 16px 0;">
      <div class="section-eyebrow" style="margin-bottom:4px;">Video Menu</div>
      <div class="section-title" style="margin-bottom:8px;">${VENUE.name}</div>
      <p style="font-size:13px;color:var(--um-text-muted);margin-bottom:20px;">Tap a category to watch the dishes on video.</p>
      <div class="reels-grid">${cards}</div>
    </div>
    ${overlays}`;
  bindReelsEvents(); observeReelsCardVideos();
  if (requestedDishId) {
    const dish = ALL_VIDEOS.find(v => v.id === requestedDishId);
    if (dish) openReelsCategory(reelsSlug(dish.category), dish.id);
  }
}
function observeReelsCardVideos() {
  const videos = document.querySelectorAll('.reels-card-video');
  if (!videos.length) return;
  if (!('IntersectionObserver' in window)) { videos.forEach(v => { window.umLoadVideo(v); v.play().catch(() => {}); }); return; }
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) { window.umLoadVideo(entry.target); entry.target.play().catch(() => {}); }
      else entry.target.pause();
    });
  }, { threshold: 0.6 });
  videos.forEach(v => observer.observe(v));
}
const reelsFeedCleanup = {};
function updateReelsProgress(rail, activeIdx) {
  Array.from(rail.children).forEach((bar, i) => {
    const fill = bar.querySelector('.reels-progress-fill');
    if (i < activeIdx) { fill.style.transition = 'none'; fill.style.width = '100%'; }
    else if (i === activeIdx) { fill.style.width = '0%'; void fill.offsetWidth; fill.style.transition = 'width 5s linear'; fill.style.width = '100%'; }
    else { fill.style.transition = 'none'; fill.style.width = '0%'; }
  });
}
function initReelsFeed(feed) {
  const rail = feed.closest('.reels-cat-overlay').querySelector('.reels-progress-rail');
  rail.innerHTML = Array.from(feed.children).map(() => `<div class="reels-progress-bar"><div class="reels-progress-fill"></div></div>`).join('');
  let currentIndex = 0;
  updateReelsProgress(rail, 0);
  const onScroll = () => { const idx = Math.round(feed.scrollTop / feed.clientHeight); if (idx !== currentIndex) { currentIndex = idx; updateReelsProgress(rail, idx); } };
  feed.addEventListener('scroll', onScroll);
  const videos = feed.querySelectorAll('video');
  videos.forEach(v => { v.muted = true; });
  let observer = null;
  if ('IntersectionObserver' in window) {
    observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) { window.umLoadVideo(entry.target); entry.target.play().catch(() => {}); }
        else entry.target.pause();
      });
    }, { threshold: 0.6, root: feed });
    videos.forEach(v => observer.observe(v));
  } else { videos.forEach(v => { window.umLoadVideo(v); v.play().catch(() => {}); }); }
  return () => {
    feed.removeEventListener('scroll', onScroll);
    if (observer) observer.disconnect();
    videos.forEach(v => { v.pause(); if (v._hls) { try { v._hls.destroy(); } catch(_) {} v._hls = null; delete v.dataset.umLoaded; } });
  };
}
function openReelsCategory(slug, dishId) {
  const el = document.getElementById(slug);
  if (!el) return;
  const isEmpty = el.classList.contains('reels-empty-state');
  el.style.display = isEmpty ? 'flex' : 'block';
  void el.offsetWidth;
  el.classList.add('open');
  const feed = el.querySelector('[data-reels-feed]');
  if (feed) {
    const target = dishId ? feed.querySelector(`[data-reels-dish="${dishId}"]`) : null;
    feed.scrollTop = target ? target.offsetTop : 0;
    reelsFeedCleanup[slug] = initReelsFeed(feed);
  }
}
function closeReelsCategory(slug) {
  const el = document.getElementById(slug);
  if (!el) return;
  el.classList.remove('open');
  if (reelsFeedCleanup[slug]) { reelsFeedCleanup[slug](); delete reelsFeedCleanup[slug]; }
  el.addEventListener('transitionend', function handler(e) {
    if (e.propertyName === 'transform') { el.style.display = 'none'; el.removeEventListener('transitionend', handler); }
  });
}
function shareReelsDish(dish) {
  const url = new URL(window.location); url.searchParams.set('dish', dish.id);
  const shareText = `${dish.dish_name} — ${VENUE.name} — Una Mesa`;
  if (navigator.share) { navigator.share({ title: dish.dish_name, text: shareText, url: url.toString() }).catch(() => {}); }
  else { window.open(`https://wa.me/?text=${encodeURIComponent(shareText + '\n' + url.toString())}`, '_blank', 'noopener'); }
}
function bindReelsEvents() {
  document.querySelectorAll('[data-reels-open]').forEach(btn => { btn.addEventListener('click', () => openReelsCategory(btn.dataset.reelsOpen)); });
  document.querySelectorAll('[data-reels-close]').forEach(btn => { btn.addEventListener('click', () => closeReelsCategory(btn.dataset.reelsClose)); });
  document.querySelectorAll('[data-reels-share]').forEach(btn => {
    btn.addEventListener('click', () => { const dish = ALL_VIDEOS.find(v => v.id === btn.dataset.reelsShare); if (dish) shareReelsDish(dish); });
  });
}
</script>
