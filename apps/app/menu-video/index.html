<style>

           El sistema "Obsidian Reserve" nunca definió una paleta clara —
           esta es una construida a propósito, usando el mismo tono crema
           que ya usa el resto de la plataforma en modo claro, para que se
           sienta parte de la misma marca, no algo inventado sin relación. */
        html.light-mode body { background: #FAF6F0 !important; }
        html.light-mode .bg-background { background-color: #FAF6F0 !important; }
        html.light-mode .text-on-background,

        .carousel-dot.active { background: rgb(255, 87, 51); transform: scale(1.3); }

        @media (max-width: 900px) {
          .menu-layout { flex-direction: column; }
          .menu-story-col { width: 100%; }
          #story-panel { position: sticky !important; top: 80px !important; }
          #cards-row > div { width: 168px !important; }
          .carousel-arrows { display: none !important; } /* en móvil se desliza con el dedo, las flechas sobran */
          .carousel-dots { display: flex !important; }
        }
        /* ── Tipografía explícita ──
           Antes dependía de que Tailwind generara correctamente estas
           clases personalizadas (font-headline-lg, etc.) — igual que
           pasó antes con la proporción del video, el CDN de Tailwind no
           siempre las resuelve de forma confiable. Esto lo garantiza
           con CSS normal, sin depender de eso, para que coincida
           siempre con la tipografía real del resto de la plataforma. */
        .font-headline-lg, .font-headline-md { font-family: 'Playfair Display', Georgia, serif !important; }
        .font-body-base, .font-body-medium, .font-label-eyebrow { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif !important; }

async function sbSelect(table, query) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    if (!res.ok) return [];
    return res.json();
  } catch (e) {
    return null;
  }
}

function appHost() {
  return window.location.hostname.endsWith('.co.uk') ? 'app.unamesa.co.uk' : 'app.unamesa.co';
}
function bookUrl() { return `https://${appHost()}/#detail/${venueId}`; }
function profileUrl() { return `https://${appHost()}/#detail/${venueId}`; }

function renderMessage(msg) {
  const html = `<p class="text-on-surface-variant py-24 text-center px-5">${msg}</p>`;
  document.getElementById('content').innerHTML = html;
  // Espejo en la vista Reels (mobile) — sin esto, un venue sin platos o con
  // error de carga se quedaría con #reels-view vacío y en blanco en mobile,
  // ya que #content (donde este mensaje normalmente aparece) está oculto
  // por CSS en ese ancho.
  const reels = document.getElementById('reels-view');
  if (reels) reels.innerHTML = html;
}

function fmtTime(s) {
  if (!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${String(sec).padStart(2, '0')}`;
}

const STANDARD_CATEGORIES = ['Starters', 'Mains', 'Sides', 'Cocktails', 'Desserts'];

function renderCatNav() {
  const realCats = [...new Set(ALL_VIDEOS.map(v => v.category))];
  let cats;
  if (VENUE && VENUE.category_order) {
    const saved = VENUE.category_order.split(',').map(s => s.trim()).filter(Boolean);
    const savedThatStillExist = saved.filter(c => realCats.includes(c));
    const newOnes = realCats.filter(c => !saved.includes(c));
    cats = [...savedThatStillExist, ...newOnes];
  } else {
    const extraCats = realCats.filter(c => !STANDARD_CATEGORIES.includes(c));
    cats = [...STANDARD_CATEGORIES, ...extraCats];
  }
  const nav = document.getElementById('cat-nav');
  nav.innerHTML = cats.map(c => `
    <a href="#" data-cat="${c}" class="${c === currentCategory ? '' : 'text-on-surface-variant dark:text-on-surface-variant'} font-body-medium text-body-medium hover:text-primary transition-colors duration-300" style="${c === currentCategory ? 'color: rgb(255, 87, 51); font-weight:700;' : ''}">${c}</a>
  `).join('');
  nav.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const cat = a.dataset.cat;
      const first = ALL_VIDEOS.find(v => v.category === cat);
      if (first) {
        selectDish(first.id);
      } else {
        currentCategory = cat;
        renderCatNav();
        renderMessage(`No dishes in "${cat}" yet — check back soon.`);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });
  });
}

function shareDish() {
  const shareText = `${currentDish.dish_name} — ${VENUE.name} — Una Mesa`;
  if (navigator.share) {
    navigator.share({ title: currentDish.dish_name, text: shareText, url: window.location.href }).catch(() => {});
  } else {
    window.open(`https://wa.me/?text=${encodeURIComponent(shareText + '\n' + window.location.href)}`, '_blank', 'noopener');
  }
}

function renderStoryPanel() {

function bindCardEvents() {
  const row = document.getElementById('cards-row');
  if (row) {
    const isMobile = window.innerWidth <= 900;
    const containerPadding = isMobile ? 48 : 380; // 380 ≈ ancho de la columna de la historia + separación en escritorio
    // La página tiene un ancho máximo real de 1240px (max-w-max-width) —
    // en monitores anchos, usar window.innerWidth directo se pasaba de
    // ese límite y le daba al carrusel más espacio del que en verdad
    // tiene visible, eliminando el desbordamiento necesario para
    // desplazar. Este límite evita ese error de cálculo.
    const pageMaxWidth = 1240;
    const effectiveWidth = Math.min(window.innerWidth, pageMaxWidth);
    const rawWidth = Math.max(280, effectiveWidth - containerPadding);
    // Redondear hacia abajo al múltiplo exacto de una tarjeta completa
    // (220px + 20px de separación = 240px) — así, sin importar el
    // ancho exacto de la ventana, nunca se corta una tarjeta a la
    // mitad en el borde derecho del carrusel.
    const cardUnit = 240;
    const wholeCards = Math.max(1, Math.floor(rawWidth / cardUnit));
    row.style.width = (wholeCards * cardUnit - 20) + 'px'; // -20: el último no necesita separación después
  }
  document.getElementById('car-left')?.addEventListener('click', () => row.scrollBy({ left: -260, behavior: 'smooth' }));
  document.getElementById('car-right')?.addEventListener('click', () => row.scrollBy({ left: 260, behavior: 'smooth' }));

  // Ocultar cada flecha cuando ya no hay nada más para ese lado — así
  // nunca tapan visualmente el borde de la primera o última tarjeta
  // cuando no hacen falta.
  const leftArrow = document.getElementById('car-left');
  const rightArrow = document.getElementById('car-right');
  const updateArrowVisibility = () => {
    if (!row || !leftArrow || !rightArrow) return;
    const maxScroll = row.scrollWidth - row.clientWidth;
    leftArrow.style.display = row.scrollLeft <= 10 ? 'none' : 'flex';
    rightArrow.style.display = row.scrollLeft >= maxScroll - 10 ? 'none' : 'flex';
  };
  if (row) {
    updateArrowVisibility();
    row.addEventListener('scroll', updateArrowVisibility);
  }

  // Puntos de posición — solo se ven en móvil, como pista de que hay
  // más platos deslizando el dedo, en vez de depender de las flechas.
  const cards = row ? Array.from(row.children) : [];
  const dotsWrap = document.getElementById('scroll-dots');
  if (dotsWrap && cards.length > 1) {
    dotsWrap.innerHTML = cards.map((_, i) => `<div class="carousel-dot${i === 0 ? ' active' : ''}"></div>`).join('');
    const dots = Array.from(dotsWrap.children);
    let scrollTimeout;
    row.addEventListener('scroll', () => {
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        const cardWidth = cards[0].getBoundingClientRect().width + 20; // 20 = separación entre tarjetas
        const activeIdx = Math.round(row.scrollLeft / cardWidth);
        dots.forEach((d, i) => d.classList.toggle('active', i === Math.min(activeIdx, dots.length - 1)));
      }, 80);
    });
  }

  document.querySelectorAll('[data-select]').forEach(el => {
    el.addEventListener('click', () => {
      const dish = ALL_VIDEOS.find(v => v.id === el.dataset.select);
      if (!dish) return;
      currentDish = dish;
      const url = new URL(window.location);
      url.searchParams.set('dish', dish.id);
      window.history.replaceState({}, '', url);
      renderStoryPanel();
    });
  });
  // Los navegadores móviles (sobre todo iOS Safari) solo permiten que
  // pocos videos se reproduzcan a la vez — por eso antes solo uno
  // arrancaba. Con IntersectionObserver, cada video se reproduce SOLO
  // cuando está visible en pantalla, y se pausa al salir de vista —
  // nunca se piden más de uno o dos a la vez, que es lo que el
  // navegador sí permite de forma confiable.
  const videos = document.querySelectorAll('#cards-row video');
  videos.forEach(v => { v.muted = true; });
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.play().catch(() => {});
        else entry.target.pause();
      });
    }, { threshold: 0.6 });
    videos.forEach(v => observer.observe(v));
  } else {
    videos.forEach(v => v.play().catch(() => {}));
  }
}


function selectDish(dishId) {

async function init() {
  if (!venueSlug) { renderMessage('Missing restaurant.'); return; }

  const venues = await sbSelect('venues', `slug=eq.${venueSlug}&select=id,name,menu_video_access,category_order`);
  if (venues === null) { renderMessage("Couldn't connect right now — please try again in a moment."); return; }
  VENUE = venues[0];
  if (!VENUE || !VENUE.menu_video_access) { renderMessage("This restaurant's video menu isn't available yet."); return; }

  venueId = VENUE.id; // a partir de aquí, el resto del archivo sigue usando el uuid real tal cual antes
  document.getElementById('back-link').href = profileUrl();

  document.title = `${VENUE.name} — Video Menu — Una Mesa`;
  document.getElementById('venue-name').textContent = VENUE.name;

  ALL_VIDEOS = await sbSelect('menu_videos', `venue_id=eq.${venueId}&order=sort_order`);

  selectDish(startDish.id);

// Modo claro/oscuro — se recuerda entre visitas con localStorage.
(function initTheme() {
  const themeToggle = document.getElementById('theme-toggle');
  const themeIcon = document.getElementById('theme-icon');
  const applyTheme = () => {
    const isLight = localStorage.getItem('una-mesa-theme') === 'light';
    document.documentElement.classList.toggle('light-mode', isLight);
    themeIcon.textContent = isLight ? 'dark_mode' : 'light_mode';
  };
  applyTheme();
  themeToggle.addEventListener('click', () => {
    const current = localStorage.getItem('una-mesa-theme') === 'light' ? 'dark' : 'light';
    localStorage.setItem('una-mesa-theme', current);
    applyTheme();
  });
})();

<script>
/* ════ Vista REELS — solo mobile (ver @media (max-width:900px) en <style>) ════
   Adaptado de menu-reels.html (claude.ai, versión final). Lee los mismos
   ALL_VIDEOS/VENUE/requestedDishId ya cargados por el script de arriba —
   no hace fetch propio, no toca renderPage/bindCardEvents/renderCatNav. */

function reelsCategories() {
  // Misma lógica que renderCatNav() de arriba, duplicada a propósito para
  // no tocar esa función — ver nota en el bloque de estilos.
  const realCats = [...new Set(ALL_VIDEOS.map(v => v.category))];
  if (VENUE && VENUE.category_order) {
    const saved = VENUE.category_order.split(',').map(s => s.trim()).filter(Boolean);
    const savedThatStillExist = saved.filter(c => realCats.includes(c));
    const newOnes = realCats.filter(c => !saved.includes(c));
    return [...savedThatStillExist, ...newOnes];
  }
  const extraCats = realCats.filter(c => !STANDARD_CATEGORIES.includes(c));
  return [...STANDARD_CATEGORIES, ...extraCats];
}

function stripAutoplayOnMobile() {
  // renderPage() (arriba, sin tocar) escribe <video autoplay> para la
  // categoría actual dentro de #content — autoplay dispara la descarga
  // sin importar preload ni display:none. En mobile #content está oculto
  // por CSS y ese carrusel nunca se ve, así que ahí ese autoplay es puro
  // desperdicio (~19.6MB medidos en un caso real de 4 platos). En
  // escritorio no se toca nada.
  if (window.innerWidth > 900) return;
  document.querySelectorAll('#content video[autoplay]').forEach(v => {
    v.removeAttribute('autoplay');
    v.pause();
  });
}

function reelsSlug(cat) {
  return 'reels-cat-' + cat.toLowerCase().replace(/[^a-z0-9]+/g, '-');
}

function reelsVideoTag(url, thumb, cls) {
  if (!url) return `<div class="absolute inset-0 bg-cover bg-center" style="background-image:url('${thumb || DEMO_HERO_PHOTO}');"></div>`;
  // preload="none": nada se descarga hasta que el IntersectionObserver
  // llame a .play() — sin esto, el navegador decide por su cuenta cuánto
  // precargar de cada plato, incluso los que nunca llegan a verse.
  return `<video class="${cls}" src="${url}" muted loop playsinline preload="none"${thumb ? ` poster="${thumb}"` : ''}></video>`;
}

function renderReelsHome() {
  const view = document.getElementById('reels-view');
  if (!view || !VENUE || !ALL_VIDEOS.length) return;
  // En escritorio esta vista nunca se muestra (oculta por CSS) — no
  // construir sus <video> ahí evita que el navegador dispare peticiones
  // preload=metadata de más por cada plato, sin ningún beneficio visual.
  // Mismo criterio de recalcular solo por llamada, no reactivo a resize,
  // que ya usa bindCardEvents() para el carrusel.
  if (window.innerWidth > 900) { view.innerHTML = ''; return; }
  const cats = reelsCategories();

  const cards = cats.map(cat => {
    const dishes = ALL_VIDEOS.filter(v => v.category === cat);
    const first = dishes[0];

    return `
      <button data-reels-open="${reelsSlug(cat)}" class="group relative block w-full flex-1 min-h-[110px] overflow-hidden rounded-lg transition-all active:scale-[0.98] text-left">
        ${first ? reelsVideoTag(first.video_url, first.thumbnail_url, 'absolute inset-0 w-full h-full object-cover bg-black reels-card-video') : `<div class="absolute inset-0" style="background:var(--surface-container-high,#2a2a2a);"></div>`}
        <div class="absolute inset-0 reels-category-overlay"></div>

          <div class="inline-flex items-center px-2.5 py-0.5 mb-1.5 rounded-full w-fit" style="background:rgba(255,87,51,.2); backdrop-filter:blur(6px); border:1px solid rgba(255,87,51,.3);">
            <span class="font-label-eyebrow text-label-eyebrow" style="color: rgb(255, 87, 51);">${badge}</span>
          </div>
          <h2 class="font-headline-md text-on-surface" style="font-size:19px; font-weight:700;">${cat}</h2>
        </div>
      </button>`;
  }).join('');

  const overlays = cats.map(cat => {
    const dishes = ALL_VIDEOS.filter(v => v.category === cat);
    const slug = reelsSlug(cat);
    if (!dishes.length) {
      return `
      <div class="reels-empty-state" id="${slug}">
        <button data-reels-close="${slug}" class="absolute top-4 left-4 w-10 h-10 flex items-center justify-center rounded-full" style="background:rgba(255,255,255,.1); backdrop-filter:blur(6px); border:.5px solid rgba(255,255,255,.2);">
          <span class="material-symbols-outlined text-primary" style="color: rgb(255, 87, 51);">arrow_back</span>
        </button>
        <span class="material-symbols-outlined" style="font-size:38px; color: rgb(255, 87, 51);">restaurant</span>
        <h2 class="font-headline-md text-on-surface" style="font-size:21px; font-weight:700;">${cat} — coming soon</h2>
        <p class="text-on-surface-variant" style="max-width:280px;">No videos in this category yet. They'll be added once filmed.</p>
      </div>`;
    }
    const slides = dishes.map(d => `
      <section class="reels-snap-item" data-reels-dish="${d.id}">
        ${reelsVideoTag(d.video_url, d.thumbnail_url, 'absolute inset-0 w-full h-full object-cover bg-black')}
        <div class="absolute inset-0 reels-gradient-overlay"></div>
        <div class="absolute bottom-28 left-0 w-full px-5 flex justify-between items-end">
          <div class="max-w-[70%]">
            ${d.is_chefs_choice ? `<span class="inline-block px-3 py-1 mb-3 rounded-full font-label-eyebrow text-label-eyebrow text-on-primary" style="background-color: rgb(255,87,51); font-size:10px;">CHEF'S CHOICE</span>` : ''}
            <h1 class="font-headline-md text-on-surface mb-1" style="font-size:21px; font-weight:700;">${d.dish_name}</h1>
            ${d.subtitle ? `<p class="font-label-eyebrow" style="color: rgb(255,87,51); font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px;">${d.subtitle}</p>` : ''}
            <p class="text-on-surface-variant" style="font-size:14.5px; line-height:1.5; opacity:.85;">${d.story_body || DEMO_STORY_BODY}</p>
          </div>
          <div class="flex flex-col gap-5 items-center">
            <a href="${bookUrl()}" class="w-11 h-11 flex items-center justify-center rounded-full active:scale-90 transition-all" style="background:rgba(255,255,255,.1); backdrop-filter:blur(6px); border:.5px solid rgba(255,255,255,.2);">
              <span class="material-symbols-outlined text-white">calendar_today</span>
            </a>
            <button data-reels-share="${d.id}" class="w-11 h-11 flex items-center justify-center rounded-full active:scale-90 transition-all" style="background:rgba(255,255,255,.1); backdrop-filter:blur(6px); border:.5px solid rgba(255,255,255,.2);">
              <span class="material-symbols-outlined text-white">share</span>
            </button>
          </div>
        </div>
      </section>`).join('');

    return `
    <div class="reels-cat-overlay" id="${slug}">
      <header class="absolute top-0 left-0 z-10 p-4 w-full flex items-center justify-between">
        <button data-reels-close="${slug}" class="w-10 h-10 flex items-center justify-center rounded-full active:scale-95 transition-transform" style="background:rgba(255,255,255,.1); backdrop-filter:blur(6px); border:.5px solid rgba(255,255,255,.2);">
          <span class="material-symbols-outlined" style="color: rgb(255, 87, 51);">arrow_back</span>
        </button>
        <div class="absolute top-6 left-1/2 -translate-x-1/2 w-1/2 flex gap-1.5 reels-progress-rail"></div>
      </header>
      <main class="reels-snap-container" data-reels-feed="${slug}">${slides}</main>
      <div class="absolute bottom-0 left-0 w-full z-10 px-5 pb-8">
        <a href="${bookUrl()}" class="block w-full h-14 text-on-primary text-center rounded-full shadow-2xl active:scale-95 transition-transform uppercase font-label-eyebrow" style="background-color: rgb(255,87,51); line-height:56px; letter-spacing:.12em; font-size:13px;">Reserve a table</a>
      </div>
    </div>`;
  }).join('');

  view.innerHTML = `
    <div id="reels-home-inner" class="px-5 pt-6 pb-8 flex flex-col" style="min-height:60vh;">
      <section class="mb-4">
        <h1 class="font-headline-lg text-headline-lg text-on-surface" style="font-size:26px;">Video Menu</h1>
        <p class="text-on-surface-variant" style="font-size:13.5px;">Tap a category to watch the dishes on video.</p>
      </section>
      <div class="flex flex-col gap-3 flex-1">${cards}</div>
    </div>
    ${overlays}
  `;

  bindReelsEvents();
  observeReelsCardVideos();

  if (requestedDishId) {
    const dish = ALL_VIDEOS.find(v => v.id === requestedDishId);
    if (dish) openReelsCategory(reelsSlug(dish.category), dish.id);
  }
}

function observeReelsCardVideos() {
  const videos = document.querySelectorAll('.reels-card-video');
  if (!videos.length) return;
  if (!('IntersectionObserver' in window)) { videos.forEach(v => v.play().catch(() => {})); return; }
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => { entry.isIntersecting ? entry.target.play().catch(() => {}) : entry.target.pause(); });
  }, { threshold: 0.6 });
  videos.forEach(v => observer.observe(v));
}

const reelsFeedCleanup = {};

function updateReelsProgress(rail, activeIdx) {
  Array.from(rail.children).forEach((bar, i) => {
    const fill = bar.querySelector('.reels-progress-fill');
    if (i < activeIdx) { fill.style.transition = 'none'; fill.style.width = '100%'; }
    else if (i === activeIdx) { fill.style.width = '0%'; void fill.offsetWidth; fill.style.transition = 'width 5s linear'; fill.style.width = '100%'; }
    else { fill.style.transition = 'none'; fill.style.width = '0%'; }
  });
}

function initReelsFeed(feed) {
  const rail = feed.closest('.reels-cat-overlay').querySelector('.reels-progress-rail');
  rail.innerHTML = Array.from(feed.children).map(() => `<div class="flex-1 reels-progress-bar"><div class="reels-progress-fill"></div></div>`).join('');
  let currentIndex = 0;
  updateReelsProgress(rail, 0);

  const onScroll = () => {
    const idx = Math.round(feed.scrollTop / feed.clientHeight);
    if (idx !== currentIndex) { currentIndex = idx; updateReelsProgress(rail, idx); }
  };
  feed.addEventListener('scroll', onScroll);

  const videos = feed.querySelectorAll('video');
  videos.forEach(v => { v.muted = true; });
  let observer = null;
  if ('IntersectionObserver' in window) {
    observer = new IntersectionObserver(entries => {
      entries.forEach(entry => { entry.isIntersecting ? entry.target.play().catch(() => {}) : entry.target.pause(); });
    }, { threshold: 0.6, root: feed });
    videos.forEach(v => observer.observe(v));
  } else {
    videos.forEach(v => v.play().catch(() => {}));
  }

  return () => {
    feed.removeEventListener('scroll', onScroll);
    if (observer) observer.disconnect();
    videos.forEach(v => v.pause());
  };
}

function openReelsCategory(slug, dishId) {
  const el = document.getElementById(slug);
  if (!el) return;
  const isEmpty = el.classList.contains('reels-empty-state');
  el.style.display = isEmpty ? 'flex' : 'block';
  void el.offsetWidth;
  el.classList.add('open');
  const feed = el.querySelector('[data-reels-feed]');
  if (feed) {
    const target = dishId ? feed.querySelector(`[data-reels-dish="${dishId}"]`) : null;
    feed.scrollTop = target ? target.offsetTop : 0;
    reelsFeedCleanup[slug] = initReelsFeed(feed);
  }
}

function closeReelsCategory(slug) {
  const el = document.getElementById(slug);
  if (!el) return;
  el.classList.remove('open');
  if (reelsFeedCleanup[slug]) { reelsFeedCleanup[slug](); delete reelsFeedCleanup[slug]; }
  el.addEventListener('transitionend', function handler(e) {
    if (e.propertyName === 'transform') { el.style.display = 'none'; el.removeEventListener('transitionend', handler); }
  });
}

function shareReelsDish(dish) {
  const url = new URL(window.location);
  url.searchParams.set('dish', dish.id);
  const shareText = `${dish.dish_name} — ${VENUE.name} — Una Mesa`;
  if (navigator.share) {
    navigator.share({ title: dish.dish_name, text: shareText, url: url.toString() }).catch(() => {});
  } else {
    window.open(`https://wa.me/?text=${encodeURIComponent(shareText + '\n' + url.toString())}`, '_blank', 'noopener');
  }
}

function bindReelsEvents() {
  document.querySelectorAll('[data-reels-open]').forEach(btn => {
    btn.addEventListener('click', () => openReelsCategory(btn.dataset.reelsOpen));
  });
  document.querySelectorAll('[data-reels-close]').forEach(btn => {
    btn.addEventListener('click', () => closeReelsCategory(btn.dataset.reelsClose));
  });
  document.querySelectorAll('[data-reels-share]').forEach(btn => {
    btn.addEventListener('click', () => {
      const dish = ALL_VIDEOS.find(v => v.id === btn.dataset.reelsShare);
      if (dish) shareReelsDish(dish);
    });
  });
}
</script>
