async function sbSelect(table, query) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    if (!res.ok) return [];
    return res.json();
  } catch (e) {
    return null;
  }
}

function appHost() {
  return window.location.hostname.endsWith('.co.uk') ? 'app.unamesa.co.uk' : 'app.unamesa.co';
}
function bookUrl() { return `https://${appHost()}/#detail/${venueId}`; }
function profileUrl() { return `https://${appHost()}/#detail/${venueId}`; }

function renderMessage(msg) {
  document.getElementById('content').innerHTML = `<p class="text-on-surface-variant py-24 text-center">${msg}</p>`;
}

function fmtTime(s) {
  if (!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${String(sec).padStart(2, '0')}`;
}

const STANDARD_CATEGORIES = ['Starters', 'Mains', 'Sides', 'Cocktails', 'Desserts'];

function renderCatNav() {
  const realCats = [...new Set(ALL_VIDEOS.map(v => v.category))];
  const extraCats = realCats.filter(c => !STANDARD_CATEGORIES.includes(c));
  const cats = [...STANDARD_CATEGORIES, ...extraCats];
  const nav = document.getElementById('cat-nav');
  nav.innerHTML = cats.map(c => `
    <a href="#" data-cat="${c}" class="${c === currentCategory ? '' : 'text-on-surface-variant dark:text-on-surface-variant'} font-body-medium text-body-medium hover:text-primary transition-colors duration-300" style="${c === currentCategory ? 'color: rgb(255, 87, 51); font-weight:700;' : ''}">${c}</a>
  `).join('');
  nav.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const cat = a.dataset.cat;
      const first = ALL_VIDEOS.find(v => v.category === cat);
      if (first) {
        selectDish(first.id);
      } else {
        currentCategory = cat;
        renderCatNav();
        renderMessage(`No dishes in "${cat}" yet — check back soon.`);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });
  });
}

function shareDish() {
  const shareText = `${currentDish.dish_name} — ${VENUE.name} — Una Mesa`;

    navigator.share({ title: currentDish.dish_name, text: shareText, url: window.location.href }).catch(() => {});
  } else {
    window.open(`https://wa.me/?text=${encodeURIComponent(shareText + '\n' + window.location.href)}`, '_blank', 'noopener');
  }
}

      <button id="car-right" class="carousel-arrows" style="position:absolute; z-index:60; top:0; bottom:24px; right:0; width:56px; display:flex; align-items:center; justify-content:flex-end; padding-right:4px; background:linear-gradient(to left, var(--surface,#131313) 10%, transparent); border:none; color:#fff; cursor:pointer;">
        <span style="width:36px;height:36px;border-radius:999px;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;"><span class="material-symbols-outlined">chevron_right</span></span>
      </button>
    </div>
    <div id="scroll-dots" class="carousel-dots"></div>
  </div>
  <div class="menu-story-col">
    <div id="story-panel" style="position:sticky; top:24px;"></div>
  </div>
</div>
  `;

  renderStoryPanel();
  bindCardEvents();
}

function bindCardEvents() {
  const row = document.getElementById('cards-row');
  if (row) {
    const isMobile = window.innerWidth <= 900;
    const containerPadding = isMobile ? 48 : 380; // 380 ≈ ancho de la columna de la historia + separación en escritorio
    // La página tiene un ancho máximo real de 1240px (max-w-max-width) —
    // en monitores anchos, usar window.innerWidth directo se pasaba de
    // ese límite y le daba al carrusel más espacio del que en verdad
    // tiene visible, eliminando el desbordamiento necesario para
    // desplazar. Este límite evita ese error de cálculo.
    const pageMaxWidth = 1240;
    const effectiveWidth = Math.min(window.innerWidth, pageMaxWidth);
    const rawWidth = Math.max(280, effectiveWidth - containerPadding);
    // Redondear hacia abajo al múltiplo exacto de una tarjeta completa
    // (220px + 20px de separación = 240px) — así, sin importar el
    // ancho exacto de la ventana, nunca se corta una tarjeta a la
    // mitad en el borde derecho del carrusel.
    const cardUnit = 240;
    const wholeCards = Math.max(1, Math.floor(rawWidth / cardUnit));
    row.style.width = (wholeCards * cardUnit - 20) + 'px'; // -20: el último no necesita separación después
  }
  document.getElementById('car-left')?.addEventListener('click', () => row.scrollBy({ left: -260, behavior: 'smooth' }));
  document.getElementById('car-right')?.addEventListener('click', () => row.scrollBy({ left: 260, behavior: 'smooth' }));

  // Puntos de posición — solo se ven en móvil, como pista de que hay
  // más platos deslizando el dedo, en vez de depender de las flechas.
  const cards = row ? Array.from(row.children) : [];
  const dotsWrap = document.getElementById('scroll-dots');
  if (dotsWrap && cards.length > 1) {
    dotsWrap.innerHTML = cards.map((_, i) => `<div class="carousel-dot${i === 0 ? ' active' : ''}"></div>`).join('');
    const dots = Array.from(dotsWrap.children);
    let scrollTimeout;
    row.addEventListener('scroll', () => {
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        const cardWidth = cards[0].getBoundingClientRect().width + 20; // 20 = separación entre tarjetas
        const activeIdx = Math.round(row.scrollLeft / cardWidth);
        dots.forEach((d, i) => d.classList.toggle('active', i === Math.min(activeIdx, dots.length - 1)));
      }, 80);
    });
  }

  document.querySelectorAll('[data-select]').forEach(el => {
    el.addEventListener('click', () => {
      const dish = ALL_VIDEOS.find(v => v.id === el.dataset.select);
      if (!dish) return;
      currentDish = dish;
      const url = new URL(window.location);
      url.searchParams.set('dish', dish.id);
      window.history.replaceState({}, '', url);
      renderStoryPanel();
    });
  });
  // Los navegadores móviles (sobre todo iOS Safari) solo permiten que
  // pocos videos se reproduzcan a la vez — por eso antes solo uno
  // arrancaba. Con IntersectionObserver, cada video se reproduce SOLO
  // cuando está visible en pantalla, y se pausa al salir de vista —
  // nunca se piden más de uno o dos a la vez, que es lo que el
  // navegador sí permite de forma confiable.
  const videos = document.querySelectorAll('#cards-row video');
  videos.forEach(v => { v.muted = true; });
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.play().catch(() => {});
        else entry.target.pause();
      });
    }, { threshold: 0.6 });
    videos.forEach(v => observer.observe(v));
  } else {
    videos.forEach(v => v.play().catch(() => {}));
  }
}


function selectDish(dishId) {
  currentDish = ALL_VIDEOS.find(v => v.id === dishId);
  if (!currentDish) return;
  currentCategory = currentDish.category;
  const url = new URL(window.location);
  url.searchParams.set('dish', dishId);
  window.history.replaceState({}, '', url);
  renderCatNav();
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function init() {
  if (!venueId) { renderMessage('Missing restaurant.'); return; }
  document.getElementById('back-link').href = profileUrl();

  const venues = await sbSelect('venues', `id=eq.${venueId}&select=id,name,menu_video_access`);
  if (venues === null) { renderMessage("Couldn't connect right now — please try again in a moment."); return; }
  VENUE = venues[0];
  if (!VENUE || !VENUE.menu_video_access) { renderMessage("This restaurant's video menu isn't available yet."); return; }

  document.title = `${VENUE.name} — Video Menu — Una Mesa`;
  document.getElementById('venue-name').textContent = VENUE.name;

  ALL_VIDEOS = await sbSelect('menu_videos', `venue_id=eq.${venueId}&order=sort_order`);
  if (ALL_VIDEOS === null) { renderMessage("Couldn't load the menu right now — please try again in a moment."); return; }
  if (ALL_VIDEOS.length === 0) { renderMessage("This restaurant hasn't uploaded any dishes yet."); return; }

  const startDish = (requestedDishId && ALL_VIDEOS.find(v => v.id === requestedDishId)) || ALL_VIDEOS[0];
  selectDish(startDish.id);
}

init().catch(() => renderMessage('Something went wrong loading this page — please try again.'));

// Modo claro/oscuro — se recuerda entre visitas con localStorage.
(function initTheme() {
  const themeToggle = document.getElementById('theme-toggle');
  const themeIcon = document.getElementById('theme-icon');
  const applyTheme = () => {
    const isLight = localStorage.getItem('una-mesa-theme') === 'light';
    document.documentElement.classList.toggle('light-mode', isLight);
    themeIcon.textContent = isLight ? 'dark_mode' : 'light_mode';
  };
  applyTheme();
  themeToggle.addEventListener('click', () => {
    const current = localStorage.getItem('una-mesa-theme') === 'light' ? 'dark' : 'light';
    localStorage.setItem('una-mesa-theme', current);
    applyTheme();
  });
})();

// Micro-interactions — con delegación de eventos, ya que el contenido se genera dinámicamente.
document.addEventListener('mousedown', e => { e.target.closest('a, button')?.classList.add('scale-95'); });
document.addEventListener('mouseup', e => { e.target.closest('a, button')?.classList.remove('scale-95'); });
document.addEventListener('mouseleave', e => { e.target.closest?.('a, button')?.classList.remove('scale-95'); }, true);
</script>
