<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una Mesa — Admin</title>
<link rel="icon" type="image/png" href="/restaurants/icon.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --coral: #D8552E;
    --coral-dark: #B8431F;
    --ink: #1A130D;
    --muted: #6B6259;
    --line: #E8E0D4;
    --bg: #F7F5F2;
    --sidebar-bg: #1A130D;
    --sidebar-text: #C9BFB3;
    --sidebar-active: #FAF6F0;
    --green: #2E7D32;
    --red: #B8431F;
    --amber: #B8860B;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Manrope',sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
  button { font-family:inherit; cursor:pointer; }
  a { color:inherit; }

  /* ── Login screen ── */
  #login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px; }
  .login-card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:40px; width:340px; text-align:center; box-shadow:0 8px 32px rgba(26,19,13,.08); }
  .login-logo { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:24px; }
  .login-logo img { width:32px; height:32px; border-radius:9px; }
  .login-logo span { font-weight:800; font-size:20px; }
  .login-logo .accent { color:var(--coral); }
  .btn-google { width:100%; height:46px; border-radius:10px; border:1.5px solid var(--line); background:#fff; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; gap:10px; }
  .btn-google:hover { background:var(--bg); }
  .login-err { color:var(--red); font-size:13px; margin-top:16px; }

  /* ── Shell ── */
  #app-shell { display:none; min-height:100vh; }
  #app-shell.visible { display:flex; }
  .sidebar { width:230px; background:var(--sidebar-bg); color:var(--sidebar-text); flex-shrink:0; display:flex; flex-direction:column; padding:24px 16px; }
  .sb-logo { display:flex; align-items:center; gap:8px; padding:0 8px; margin-bottom:32px; }
  .sb-logo img { width:28px; height:28px; border-radius:8px; }
  .sb-logo span { font-weight:800; font-size:17px; color:#fff; }
  .sb-nav a { display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:8px; text-decoration:none; font-weight:600; font-size:14px; margin-bottom:2px; }
  .sb-nav a:hover { background:rgba(255,255,255,.06); }
  .sb-nav a.active { background:var(--coral); color:#fff; }
  .sb-nav svg { width:18px; height:18px; flex-shrink:0; }
  .sb-foot { margin-top:auto; padding:12px 8px; font-size:12px; color:#8a7c6d; }
  .sb-foot button { background:none; border:none; color:#C9BFB3; font-size:13px; font-weight:600; padding:0; margin-top:6px; }
  .sb-foot button:hover { color:#fff; }

  .main { flex:1; padding:32px 40px; overflow-y:auto; }
  .page-title { font-size:24px; font-weight:800; margin-bottom:4px; }
  .page-sub { color:var(--muted); font-size:14px; margin-bottom:28px; }

  /* ── Cards / metrics ── */
  .metric-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; margin-bottom:32px; }
  .metric-card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; text-align:left; font-family:inherit; width:100%; transition:transform .12s, box-shadow .12s; }
  button.metric-card { cursor:pointer; }
  button.metric-card:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(26,19,13,.08); border-color:var(--coral); }
  .metric-card.health-ok { border-color:#C8E6C9; }
  .metric-card.health-bad { border-color:#FFCC80; background:#FFF8F0; }
  .metric-card.health-bad .metric-val { color:var(--amber); }
  .metric-card.health-ok .metric-val { color:var(--green); }

  .filter-tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .filter-tab { background:#fff; border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:13px; font-weight:600; color:var(--muted); }
  .filter-tab:hover { background:var(--bg); }
  .filter-tab.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  .metric-label { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; margin-bottom:8px; }
  .metric-val { font-size:30px; font-weight:800; }
  .metric-sub { font-size:12.5px; color:var(--muted); margin-top:4px; }

  /* ── Tables ── */
  .table-card { background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:700; padding:12px 16px; border-bottom:1px solid var(--line); background:#FBFAF8; }
  td { padding:13px 16px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:#FBFAF8; }
  .pill { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .pill.on { background:#E8F5E9; color:var(--green); }
  .pill.off { background:#F4EFE6; color:var(--muted); }
  .pill.pending { background:#FFF3E0; color:var(--amber); }
  .tbl-action { background:none; border:1px solid var(--line); border-radius:7px; padding:5px 11px; font-size:12.5px; font-weight:700; color:var(--ink); }
  .tbl-action:hover { background:var(--bg); }
  .row-link:hover { color:var(--coral); text-decoration:underline; }

  .btn-primary { background:var(--coral); color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:13.5px; font-weight:700; white-space:nowrap; }
  .btn-primary:hover { background:var(--coral-dark); }
  .btn-primary:disabled { opacity:.6; cursor:not-allowed; }
  .btn-secondary { background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 18px; font-size:13.5px; font-weight:700; color:var(--ink); }
  .btn-secondary:hover { background:var(--bg); }
  .btn-danger { background:none; border:1px solid #F4C7BC; color:var(--red); border-radius:8px; padding:8px 14px; font-size:12.5px; font-weight:700; }
  .btn-danger:hover { background:#FFF3F0; }

  .form-card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; }
  .form-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:14px; }
  .form-field label { display:block; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px; }
  .form-field input, .form-field textarea, .form-field select {
    width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:13.5px; font-family:inherit; background:#fff; color:var(--ink);
  }
  .form-field textarea { resize:vertical; min-height:60px; }
  .form-field input:focus, .form-field textarea:focus, .form-field select:focus { outline:2px solid var(--coral); outline-offset:-1px; }
  .toggle-row { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); }
  .toggle-row:last-child { border-bottom:none; }
  .switch { position:relative; width:42px; height:24px; }
  .switch input { opacity:0; width:0; height:0; }
  .switch-track { position:absolute; inset:0; background:var(--line); border-radius:999px; transition:background .15s; cursor:pointer; }
  .switch-track:before { content:''; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:transform .15s; }
  .switch input:checked + .switch-track { background:var(--coral); }
  .switch input:checked + .switch-track:before { transform:translateX(18px); }

  .back-link { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; font-weight:600; margin-bottom:16px; cursor:pointer; }
  .back-link:hover { color:var(--ink); }
  .section-card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:24px; margin-bottom:20px; }
  .section-title { font-size:16px; font-weight:800; margin-bottom:4px; }
  .section-sub { color:var(--muted); font-size:13px; margin-bottom:16px; }

  .dish-card { border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .dish-card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .dish-card-head strong { font-size:14px; }
  .upload-drop { border:2px dashed var(--line); border-radius:10px; padding:20px; text-align:center; color:var(--muted); font-size:13px; cursor:pointer; }
  .upload-drop:hover { border-color:var(--coral); background:#FBF6F2; }
  .upload-drop.has-video { border-style:solid; border-color:#C8E6C9; background:#F5FBF6; color:var(--green); }
  .progress-bar-wrap { height:6px; background:var(--line); border-radius:999px; overflow:hidden; margin-top:8px; }
  .progress-bar-fill { height:100%; background:var(--coral); width:0%; transition:width .2s; }
  .empty-row td { text-align:center; color:var(--muted); padding:40px 16px; }
  .loading-txt { color:var(--muted); padding:20px; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <img src="/restaurants/icon.png" alt="">
      <span>Una <span class="accent">Mesa</span></span>
    </div>
    <button class="btn-google" id="google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.27c-.8.54-1.83.86-3.05.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.95 10.69A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.16.27-1.69V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.03l2.99-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.97l2.99 2.34C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Entrar con Google
    </button>
    <p class="login-err" id="login-err"></p>
  </div>
</div>

<div id="app-shell">
  <aside class="sidebar">
    <div class="sb-logo">
      <img src="/restaurants/icon.png" alt="">
      <span>Una Mesa Admin</span>
    </div>
    <nav class="sb-nav" id="sb-nav">
      <a href="#overview" data-view="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg> Resumen</a>
      <a href="#restaurants" data-view="restaurants"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3zM3 9h18M9 21V9"/></svg> Restaurantes</a>
      <a href="#leads" data-view="leads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg> Leads</a>
    </nav>
    <div class="sb-foot">
      <div id="sb-email"></div>
      <button id="logout-btn">Cerrar sesión</button>
    </div>
  </aside>
  <main class="main" id="main-content"></main>
</div>

<script>
const SUPABASE_URL = 'https://rkaytcmyaaighozxatod.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrYXl0Y215YWFpZ2hvenhhdG9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NDU2NDIsImV4cCI6MjA5NjQyMTY0Mn0.8zgAxW2q6JU_PySTQHBfBUHpxlDnz9UVLr6jm981x3s';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let CURRENT_VIEW = 'overview';

/* ── Auth ── */
document.getElementById('google-btn').addEventListener('click', async () => {
  await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + window.location.pathname } });
});
document.getElementById('logout-btn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.reload();
});

async function checkAdminAndInit() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { document.getElementById('login-screen').style.display = 'flex'; return; }

  const { data: adminRow } = await sb.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
  if (!adminRow) {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('login-err').textContent = `${session.user.email} no tiene acceso de administrador.`;
    return;
  }

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-shell').classList.add('visible');
  document.getElementById('sb-email').textContent = session.user.email;

  document.querySelectorAll('#sb-nav a').forEach(a => {
    a.addEventListener('click', e => { e.preventDefault(); navigate(a.dataset.view); });
  });

  const initialHash = (window.location.hash || '#overview').replace('#', '');
  if (initialHash.startsWith('restaurant/')) {
    navigateToRestaurant(initialHash.split('/')[1], true);
  } else {
    navigate(initialHash);
  }
}

function navigate(view, params) {
  CURRENT_VIEW = view;
  window.location.hash = view;
  document.querySelectorAll('#sb-nav a').forEach(a => a.classList.toggle('active', a.dataset.view === view));
  if (view === 'restaurants') renderRestaurants(params && params.filter);
  else if (view === 'leads') renderLeads();
  else renderOverview();
}

function navigateToRestaurant(id, skipHashUpdate) {
  CURRENT_VIEW = 'restaurants';
  if (!skipHashUpdate) window.location.hash = `restaurant/${id}`;
  document.querySelectorAll('#sb-nav a').forEach(a => a.classList.toggle('active', a.dataset.view === 'restaurants'));
  renderRestaurantDetail(id);
}

/* ── Overview ── */
async function renderOverview() {
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="page-title">Resumen</div>
    <div class="page-sub">Un vistazo rápido a la actividad del negocio</div>
    <div class="metric-grid" id="metric-grid"><p class="loading-txt">Cargando…</p></div>
  `;

  const [venuesRes, activeRes, leadsRes, leadsAllRes, conversionRes, healthRes] = await Promise.all([
    sb.from('venues').select('id, archived, stripe_charges_enabled, menu_video_access', { count: 'exact' }),
    sb.from('venues').select('id', { count: 'exact' }).eq('archived', false).eq('stripe_charges_enabled', true),
    sb.from('restaurant_leads').select('id', { count: 'exact' }).gt('created_at', new Date(Date.now() - 7*24*60*60*1000).toISOString()),
    sb.from('restaurant_leads').select('id', { count: 'exact' }),
    sb.from('restaurant_page_conversion').select('*').maybeSingle(),
    sb.rpc('find_cron_issues'),
  ]);

  const venues = venuesRes.data || [];
  const totalVenues = venuesRes.count ?? venues.length;
  const activeCount = activeRes.count ?? 0;
  const pendingCount = venues.filter(v => !v.archived && !v.stripe_charges_enabled).length;
  const archivedCount = venues.filter(v => v.archived).length;
  const menuVideoCount = venues.filter(v => v.menu_video_access).length;
  const leadsThisWeek = leadsRes.count ?? 0;
  const leadsTotal = leadsAllRes.count ?? 0;
  const conv = conversionRes.data;
  const healthIssues = healthRes.data || [];

  const grid = document.getElementById('metric-grid');
  grid.innerHTML = `
    <button class="metric-card" data-nav="restaurants" data-filter="active">
      <div class="metric-label">Restaurantes activos</div>
      <div class="metric-val">${activeCount}</div>
      <div class="metric-sub">de ${totalVenues} en total</div>
    </button>
    <button class="metric-card" data-nav="restaurants" data-filter="pending">
      <div class="metric-label">Pendientes de Stripe</div>
      <div class="metric-val">${pendingCount}</div>
      <div class="metric-sub">restaurantes sin conectar pago</div>
    </button>
    <button class="metric-card" data-nav="restaurants" data-filter="archived">
      <div class="metric-label">Archivados</div>
      <div class="metric-val">${archivedCount}</div>
      <div class="metric-sub">fuera del listado público</div>
    </button>
    <button class="metric-card" data-nav="restaurants" data-filter="menuvideo">
      <div class="metric-label">Con menú en video</div>
      <div class="metric-val">${menuVideoCount}</div>
      <div class="metric-sub">servicio de pago activo</div>
    </button>
    <button class="metric-card" data-nav="leads">
      <div class="metric-label">Leads (últimos 7 días)</div>
      <div class="metric-val">${leadsThisWeek}</div>
      <div class="metric-sub">${leadsTotal} en total desde el inicio</div>
    </button>
    <div class="metric-card">
      <div class="metric-label">Conversión landing restaurantes</div>
      <div class="metric-val">${conv && conv.conversion_pct_total != null ? conv.conversion_pct_total + '%' : '—'}</div>
      <div class="metric-sub">${conv ? `${conv.leads_total} leads / ${conv.views_total} visitas` : 'Sin datos aún'}</div>
    </div>
    <div class="metric-card ${healthIssues.length ? 'health-bad' : 'health-ok'}">
      <div class="metric-label">Salud del sistema</div>
      <div class="metric-val">${healthIssues.length ? healthIssues.length : '✓'}</div>
      <div class="metric-sub">${healthIssues.length
        ? healthIssues.map(i => `${i.job_name || i.venue_name}: ${i.detail}`).join(' · ')
        : 'Todo en orden — sin anomalías'}</div>
    </div>
  `;
  grid.querySelectorAll('[data-nav]').forEach(card => {
    card.addEventListener('click', () => {
      const filter = card.dataset.filter;
      navigate(card.dataset.nav, filter ? { filter } : null);
    });
  });
}

/* ── Restaurantes ── */
const FILTER_LABELS = {
  all: 'Todos', active: 'Activos', pending: 'Pendientes de Stripe',
  archived: 'Archivados', menuvideo: 'Con menú en video',
};

async function renderRestaurants(initialFilter) {
  let currentFilter = initialFilter || 'all';
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div style="display:flex; align-items:flex-start; justify-content:space-between;">
      <div>
        <div class="page-title">Restaurantes</div>
        <div class="page-sub">Todos los restaurantes conectados a Una Mesa</div>
      </div>
      <button class="btn-primary" id="new-venue-btn">+ Nuevo restaurante</button>
    </div>
    <div id="new-venue-form-wrap"></div>
    <div class="filter-tabs" id="filter-tabs"></div>
    <div class="table-card">
      <table>
        <thead><tr><th>Nombre</th><th>Ciudad</th><th>Stripe</th><th>Estado</th><th>Menú en video</th><th></th></tr></thead>
        <tbody id="venues-tbody"><tr class="empty-row"><td colspan="6">Cargando…</td></tr></tbody>
      </table>
    </div>
  `;

  document.getElementById('new-venue-btn').addEventListener('click', () => {
    const wrap = document.getElementById('new-venue-form-wrap');
    wrap.innerHTML = `
      <div class="form-card" style="margin-bottom:20px;">
        <div class="form-row">
          <div class="form-field"><label>Nombre del restaurante</label><input type="text" id="nv-name" placeholder="Ej. The Thames Table"></div>
          <div class="form-field"><label>Ciudad</label><input type="text" id="nv-city" placeholder="Ej. London"></div>
        </div>
        <div style="display:flex; gap:8px; margin-top:14px;">
          <button class="btn-primary" id="nv-save">Crear restaurante</button>
          <button class="tbl-action" id="nv-cancel">Cancelar</button>
        </div>
        <p id="nv-error" style="color:var(--red); font-size:13px; margin-top:8px;"></p>
      </div>
    `;
    document.getElementById('nv-cancel').addEventListener('click', () => { wrap.innerHTML = ''; });
    document.getElementById('nv-save').addEventListener('click', async () => {
      const name = document.getElementById('nv-name').value.trim();
      const city = document.getElementById('nv-city').value.trim();
      if (!name) { document.getElementById('nv-error').textContent = 'El nombre es obligatorio.'; return; }
      const { data: newVenue, error: insErr } = await sb.from('venues').insert({ name, city: city || null, archived: false }).select('id').single();
      if (insErr) { document.getElementById('nv-error').textContent = insErr.message; return; }
      navigateToRestaurant(newVenue.id);
    });
  });

  const { data, error } = await sb.from('venues')
    .select('id, name, city, archived, stripe_charges_enabled, menu_video_access')
    .order('name');

  const allData = data || [];

  const applyFilter = (filter) => {
    if (filter === 'active') return allData.filter(v => !v.archived && v.stripe_charges_enabled);
    if (filter === 'pending') return allData.filter(v => !v.archived && !v.stripe_charges_enabled);
    if (filter === 'archived') return allData.filter(v => v.archived);
    if (filter === 'menuvideo') return allData.filter(v => v.menu_video_access);
    return allData;
  };

  const renderTabs = () => {
    const tabs = document.getElementById('filter-tabs');
    tabs.innerHTML = Object.keys(FILTER_LABELS).map(f =>
      `<button class="filter-tab${f === currentFilter ? ' active' : ''}" data-filter="${f}">${FILTER_LABELS[f]}</button>`
    ).join('');
    tabs.querySelectorAll('[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => { currentFilter = btn.dataset.filter; renderTabs(); renderRows(); });
    });
  };

  const renderRows = () => {
    const tbody = document.getElementById('venues-tbody');
    if (error || allData.length === 0) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="6">${error ? 'Error al cargar' : 'Sin restaurantes todavía'}</td></tr>`;
      return;
    }
    const filtered = applyFilter(currentFilter);
    if (filtered.length === 0) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="6">Ningún restaurante en esta categoría</td></tr>`;
      return;
    }
    tbody.innerHTML = filtered.map(v => `
      <tr data-id="${v.id}">
        <td><strong class="row-link" data-open="${v.id}" style="cursor:pointer;">${v.name}</strong></td>
        <td>${v.city || '—'}</td>
        <td>${v.stripe_charges_enabled
          ? '<span class="pill on">Conectado</span>'
          : '<span class="pill pending">Pendiente</span>'}</td>
        <td>${v.archived
          ? '<span class="pill off">Archivado</span>'
          : '<span class="pill on">Activo</span>'}</td>
        <td>${v.menu_video_access
          ? '<span class="pill on">Sí</span>'
          : '<span class="pill off">No</span>'}</td>
        <td>
          <button class="tbl-action" data-open="${v.id}">Editar</button>
          <button class="tbl-action" data-action="toggle-archive" data-id="${v.id}" data-archived="${v.archived}">
            ${v.archived ? 'Reactivar' : 'Archivar'}
          </button>
        </td>
      </tr>
    `).join('');

    tbody.querySelectorAll('[data-open]').forEach(el => {
      el.addEventListener('click', () => navigateToRestaurant(el.dataset.open));
    });

    tbody.querySelectorAll('[data-action="toggle-archive"]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const currentlyArchived = btn.dataset.archived === 'true';
        btn.disabled = true;
        btn.textContent = '...';
        const { error: updErr } = await sb.from('venues').update({ archived: !currentlyArchived }).eq('id', id);
        if (updErr) { alert('Error: ' + updErr.message); btn.disabled = false; return; }
        renderRestaurants(currentFilter);
      });
    });
  };

  renderTabs();
  renderRows();
}

/* ── Leads ── */
async function renderLeads() {
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="page-title">Leads de restaurantes</div>
    <div class="page-sub">Restaurantes que dejaron sus datos en la landing</div>
    <div class="table-card">
      <table>
        <thead><tr><th>Restaurante</th><th>Contacto</th><th>Email</th><th>Teléfono</th><th>Ciudad</th><th>Fecha</th></tr></thead>
        <tbody id="leads-tbody"><tr class="empty-row"><td colspan="6">Cargando…</td></tr></tbody>
      </table>
    </div>
  `;

  const { data, error } = await sb.from('restaurant_leads')
    .select('restaurant_name, contact_name, email, phone, city, created_at')
    .order('created_at', { ascending: false });

  const tbody = document.getElementById('leads-tbody');
  if (error || !data || data.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="6">${error ? 'Error al cargar' : 'Sin leads todavía'}</td></tr>`;
    return;
  }

  tbody.innerHTML = data.map(l => `
    <tr>
      <td><strong>${l.restaurant_name}</strong></td>
      <td>${l.contact_name || '—'}</td>
      <td>${l.email}</td>
      <td>${l.phone || '—'}</td>
      <td>${l.city || '—'}</td>
      <td>${new Date(l.created_at).toLocaleDateString('es-ES')}</td>
    </tr>
  `).join('');
}

/* ── Detalle de restaurante ── */
const STANDARD_CATEGORIES = ['Starters', 'Mains', 'Sides', 'Cocktails', 'Desserts'];

async function renderRestaurantDetail(id) {
  const main = document.getElementById('main-content');
  main.innerHTML = `<p class="loading-txt">Cargando…</p>`;

  const { data: venue, error } = await sb.from('venues')
    .select('id, name, city, archived, stripe_charges_enabled, menu_video_access')
    .eq('id', id).maybeSingle();

  if (error || !venue) {
    main.innerHTML = `<a class="back-link" id="back-to-list">← Volver a Restaurantes</a><p class="loading-txt">No se encontró el restaurante.</p>`;
    document.getElementById('back-to-list').addEventListener('click', () => navigate('restaurants'));
    return;
  }

  const { data: dishes } = await sb.from('menu_videos')
    .select('*').eq('venue_id', id).order('sort_order');

  main.innerHTML = `
    <a class="back-link" id="back-to-list">← Volver a Restaurantes</a>
    <div class="page-title">${venue.name}</div>
    <div class="page-sub">${venue.city || 'Sin ciudad'}</div>

    <div class="section-card">
      <div class="section-title">Información básica</div>
      <div class="form-row" style="margin-bottom:14px;">
        <div class="form-field"><label>Nombre</label><input type="text" id="ed-name" value="${venue.name.replace(/"/g, '&quot;')}"></div>
        <div class="form-field"><label>Ciudad</label><input type="text" id="ed-city" value="${(venue.city || '').replace(/"/g, '&quot;')}"></div>
      </div>
      <button class="btn-primary" id="save-basic">Guardar cambios</button>
      <span id="save-basic-msg" style="margin-left:10px; font-size:13px; color:var(--green);"></span>
    </div>

    <div class="section-card">
      <div class="section-title">Estado</div>
      <div class="toggle-row">
        <div><strong>Restaurante activo</strong><br><span class="page-sub" style="margin:0;">Visible públicamente si no está archivado</span></div>
        <label class="switch"><input type="checkbox" id="tg-archived" ${venue.archived ? '' : 'checked'}><span class="switch-track"></span></label>
      </div>
      <div class="toggle-row">
        <div><strong>Menú en video</strong><br><span class="page-sub" style="margin:0;">Activa el servicio de pago del menú en video</span></div>
        <label class="switch"><input type="checkbox" id="tg-menuvideo" ${venue.menu_video_access ? 'checked' : ''}><span class="switch-track"></span></label>
      </div>
      <div class="toggle-row">
        <div><strong>Stripe Connect</strong><br><span class="page-sub" style="margin:0;">Estado de conexión de pagos (solo lectura)</span></div>
        ${venue.stripe_charges_enabled ? '<span class="pill on">Conectado</span>' : '<span class="pill pending">Pendiente</span>'}
      </div>
    </div>

    <div class="section-card">
      <div class="section-title">Menú en video — platos</div>
      <div class="section-sub">${venue.menu_video_access ? 'El servicio está activo. Administra los platos con video aquí.' : 'El servicio de menú en video no está activo — actívalo arriba para que se muestre en la web.'}</div>
      <div id="dishes-list"></div>
      <button class="btn-secondary" id="add-dish-btn">+ Agregar plato</button>
      <div id="dish-form-wrap" style="margin-top:16px;"></div>
    </div>
  `;

  document.getElementById('back-to-list').addEventListener('click', () => navigate('restaurants'));

  document.getElementById('save-basic').addEventListener('click', async () => {
    const name = document.getElementById('ed-name').value.trim();
    const city = document.getElementById('ed-city').value.trim();
    const { error: updErr } = await sb.from('venues').update({ name, city: city || null }).eq('id', id);
    const msg = document.getElementById('save-basic-msg');
    msg.textContent = updErr ? 'Error: ' + updErr.message : '✓ Guardado';
    msg.style.color = updErr ? 'var(--red)' : 'var(--green)';
    setTimeout(() => { msg.textContent = ''; }, 3000);
  });

  document.getElementById('tg-archived').addEventListener('change', async (e) => {
    const { error: tgErr } = await sb.from('venues').update({ archived: !e.target.checked }).eq('id', id);
    if (tgErr) { alert('Error al actualizar: ' + tgErr.message); e.target.checked = !e.target.checked; }
  });
  document.getElementById('tg-menuvideo').addEventListener('change', async (e) => {
    const wantsOn = e.target.checked;
    const { error: tgErr } = await sb.from('venues').update({ menu_video_access: wantsOn }).eq('id', id);
    if (tgErr) { alert('Error al actualizar: ' + tgErr.message); e.target.checked = !wantsOn; return; }
    renderRestaurantDetail(id);
  });

  renderDishesList(dishes || [], id);

  document.getElementById('add-dish-btn').addEventListener('click', () => renderDishForm(id, null));
}

function renderDishesList(dishes, venueId) {
  const wrap = document.getElementById('dishes-list');
  if (dishes.length === 0) {
    wrap.innerHTML = `<p class="page-sub">Sin platos cargados todavía.</p>`;
    return;
  }
  wrap.innerHTML = dishes.map(d => `
    <div class="dish-card">
      <div class="dish-card-head">
        <strong>${d.dish_name} <span style="color:var(--muted); font-weight:600;">— ${d.category}</span></strong>
        <div style="display:flex; gap:8px;">
          <button class="tbl-action" data-edit="${d.id}">Editar</button>
          <button class="btn-danger" data-delete="${d.id}">Eliminar</button>
        </div>
      </div>
      ${d.video_url ? `<video src="${d.video_url}" muted style="width:120px; border-radius:6px; display:block;" preload="metadata"></video>` : '<span class="page-sub">Sin video</span>'}
    </div>
  `).join('');

  wrap.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', () => {
      const dish = dishes.find(d => d.id === btn.dataset.edit);
      renderDishForm(venueId, dish);
    });
  });
  wrap.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('¿Eliminar este plato? Esta acción no se puede deshacer.')) return;
      await sb.from('menu_videos').delete().eq('id', btn.dataset.delete);
      renderRestaurantDetail(venueId);
    });
  });
}

function renderDishForm(venueId, existingDish) {
  const wrap = document.getElementById('dish-form-wrap');
  const d = existingDish || {};
  const categoryOptions = STANDARD_CATEGORIES.map(c =>
    `<option value="${c}" ${d.category === c ? 'selected' : ''}>${c}</option>`
  ).join('');

  wrap.innerHTML = `
    <div class="form-card">
      <div class="section-title" style="font-size:14px;">${existingDish ? 'Editar plato' : 'Nuevo plato'}</div>
      <div class="form-row" style="margin-bottom:12px;">
        <div class="form-field"><label>Categoría</label><select id="df-category">${categoryOptions}</select></div>
        <div class="form-field"><label>Nombre del plato</label><input type="text" id="df-name" value="${(d.dish_name || '').replace(/"/g, '&quot;')}"></div>
        <div class="form-field"><label>Subtítulo</label><input type="text" id="df-subtitle" value="${(d.subtitle || '').replace(/"/g, '&quot;')}" placeholder="Ej. Grade A5 · Kagoshima"></div>
      </div>
      <div class="form-row" style="margin-bottom:12px;">
        <div class="form-field"><label>Cita de la historia</label><input type="text" id="df-quote" value="${(d.story_quote || '').replace(/"/g, '&quot;')}"></div>
        <div class="form-field"><label>Carbohidratos (g)</label><input type="number" id="df-carbs" value="${d.carbs_g ?? ''}"></div>
        <div class="form-field"><label>Grasas (g)</label><input type="number" id="df-fats" value="${d.fats_g ?? ''}"></div>
      </div>
      <div class="form-field" style="margin-bottom:12px;"><label>Descripción de la historia</label><textarea id="df-body">${d.story_body || ''}</textarea></div>
      <div class="form-row" style="margin-bottom:14px;">
        <div class="form-field"><label>Orden</label><input type="number" id="df-sort" value="${d.sort_order ?? 1}"></div>
        <div class="toggle-row" style="border:none; padding-top:20px;">
          <span style="font-size:13px; font-weight:700;">Elección del chef</span>
          <label class="switch"><input type="checkbox" id="df-chefschoice" ${d.is_chefs_choice ? 'checked' : ''}><span class="switch-track"></span></label>
        </div>
      </div>
      <div class="form-field" style="margin-bottom:14px;">
        <label>Video del plato</label>
        <div class="upload-drop ${d.video_url ? 'has-video' : ''}" id="df-upload-drop">
          ${d.video_url ? '✓ Video cargado — sube otro archivo para reemplazarlo' : 'Haz clic para elegir un archivo de video (MP4)'}
        </div>
        <input type="file" id="df-video-file" accept="video/mp4,video/quicktime" style="display:none;">
        <div class="progress-bar-wrap" id="df-progress-wrap" style="display:none;"><div class="progress-bar-fill" id="df-progress-fill"></div></div>
        <input type="hidden" id="df-video-url" value="${d.video_url || ''}">
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn-primary" id="df-save">${existingDish ? 'Guardar cambios' : 'Crear plato'}</button>
        <button class="btn-secondary" id="df-cancel">Cancelar</button>
      </div>
      <p id="df-error" style="color:var(--red); font-size:13px; margin-top:8px;"></p>
    </div>
  `;

  document.getElementById('df-cancel').addEventListener('click', () => { wrap.innerHTML = ''; });

  const dropZone = document.getElementById('df-upload-drop');
  const fileInput = document.getElementById('df-video-file');
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    dropZone.textContent = 'Subiendo…';
    document.getElementById('df-progress-wrap').style.display = 'block';
    const path = `${venueId}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
    const { error: upErr } = await sb.storage.from('menu-videos').upload(path, file, { upsert: false });
    if (upErr) {
      dropZone.textContent = 'Error al subir: ' + upErr.message;
      document.getElementById('df-progress-wrap').style.display = 'none';
      return;
    }
    const { data: pub } = sb.storage.from('menu-videos').getPublicUrl(path);
    document.getElementById('df-video-url').value = pub.publicUrl;
    dropZone.textContent = '✓ Video subido correctamente';
    dropZone.classList.add('has-video');
    document.getElementById('df-progress-fill').style.width = '100%';
  });

  document.getElementById('df-save').addEventListener('click', async () => {
    const payload = {
      venue_id: venueId,
      category: document.getElementById('df-category').value,
      dish_name: document.getElementById('df-name').value.trim(),
      subtitle: document.getElementById('df-subtitle').value.trim() || null,
      story_quote: document.getElementById('df-quote').value.trim() || null,
      story_body: document.getElementById('df-body').value.trim() || null,
      carbs_g: document.getElementById('df-carbs').value ? Number(document.getElementById('df-carbs').value) : null,
      fats_g: document.getElementById('df-fats').value ? Number(document.getElementById('df-fats').value) : null,
      sort_order: Number(document.getElementById('df-sort').value) || 1,
      is_chefs_choice: document.getElementById('df-chefschoice').checked,
      video_url: document.getElementById('df-video-url').value || null,
    };
    if (!payload.dish_name) { document.getElementById('df-error').textContent = 'El nombre del plato es obligatorio.'; return; }

    const query = existingDish
      ? sb.from('menu_videos').update(payload).eq('id', existingDish.id)
      : sb.from('menu_videos').insert(payload);
    const { error: saveErr } = await query;
    if (saveErr) { document.getElementById('df-error').textContent = saveErr.message; return; }
    renderRestaurantDetail(venueId);
  });
}

checkAdminAndInit();
sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN') checkAdminAndInit();
});
</script>

</body>
</html>
