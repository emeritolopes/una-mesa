<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una Mesa — Admin</title>
<link rel="icon" type="image/svg+xml" href="brand/unamesa-icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Obsidian Telemetry — tema oscuro del admin (ver DESIGN.md).
     Las variables antiguas (--coral, --ink, --muted…) se mantienen con valores
     oscuros para que las vistas de Restaurantes, Leads y el detalle sigan
     funcionando sin tocar su JS. */
  :root {
    --coral: #FF5A36;
    --coral-dark: #E04624;
    --ink: #F1F5F9;
    --text: #D4E4FA;
    --muted: #94A3B8;
    --dim: #64748B;
    --line: rgba(255,255,255,.08);
    --line-soft: rgba(255,255,255,.05);
    --bg: #090D14;
    --panel: #0F172A;
    --card: rgba(21,30,46,.8);
    --card-solid: #151E2E;
    --raised: #1A2638;
    --green: #10B981;
    --red: #F87171;
    --amber: #F59E0B;
    --cyan: #06B6D4;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    color-scheme: dark;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Geist', system-ui, sans-serif; background:var(--bg); color:var(--text); font-size:14px; -webkit-font-smoothing:antialiased; }
  body { background-image: linear-gradient(to right, rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,.018) 1px, transparent 1px); background-size:32px 32px; }
  button { font-family:inherit; cursor:pointer; color:inherit; }
  a { color:inherit; }
  ::selection { background:var(--coral); color:#fff; }
  .mono, .num { font-family:var(--mono); font-variant-numeric:tabular-nums; }

  /* ── Login ── */
  #login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px; }
  .login-card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:40px; width:340px; text-align:center; }
  .login-logo { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:24px; }
  .btn-google { width:100%; height:44px; border-radius:4px; border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--ink); font-weight:600; font-size:14px; display:flex; align-items:center; justify-content:center; gap:10px; }
  .btn-google:hover { border-color:rgba(255,255,255,.2); }
  .login-err { color:var(--red); font-size:13px; margin-top:16px; }

  /* ── Shell ── */
  #app-shell { display:none; min-height:100vh; }
  #app-shell.visible { display:flex; }
  .sidebar { width:260px; background:var(--panel); border-right:1px solid rgba(255,255,255,.06); color:var(--muted); flex-shrink:0; display:flex; flex-direction:column; padding:20px 16px; position:sticky; top:0; height:100vh; }
  .sb-logo { display:flex; align-items:center; gap:8px; padding:0 4px; margin-bottom:20px; }
  .sb-badge { font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.05em; color:var(--coral); border:1px solid rgba(255,90,54,.3); background:rgba(255,90,54,.08); padding:2px 6px; border-radius:4px; }
  .sb-cta { width:100%; display:flex; align-items:center; justify-content:center; gap:6px; background:var(--coral); color:#fff; border:none; border-radius:4px; padding:9px 12px; font-size:14px; font-weight:500; margin-bottom:16px; }
  .sb-cta:hover { background:var(--coral-dark); box-shadow:0 0 16px rgba(255,90,54,.35); }
  .sb-nav a { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:4px; text-decoration:none; font-weight:500; font-size:13.5px; margin-bottom:2px; border-left:2px solid transparent; }
  .sb-nav a:hover { background:var(--card-solid); color:var(--ink); }
  .sb-nav a.active { background:var(--raised); color:var(--ink); border-left-color:var(--coral); }
  .sb-nav a.active svg { color:var(--coral); }
  .sb-nav svg { width:18px; height:18px; flex-shrink:0; }
  .sb-nav .sb-count { margin-left:auto; font-family:var(--mono); font-size:10.5px; padding:1px 6px; border-radius:4px; border:1px solid var(--line); color:var(--muted); }
  .sb-nav .sb-count.hot { color:var(--coral); border-color:rgba(255,90,54,.35); }
  .sb-foot { margin-top:auto; padding:12px 4px 0; border-top:1px solid var(--line-soft); font-size:12px; color:var(--dim); }
  .sb-foot #sb-email { color:var(--text); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sb-foot button { background:none; border:none; color:var(--muted); font-size:13px; font-weight:500; padding:0; margin-top:8px; }
  .sb-foot button:hover { color:var(--red); }

  .main { flex:1; padding:28px 32px; overflow-y:auto; min-width:0; }
  .page-title { font-size:24px; font-weight:600; letter-spacing:-.02em; color:var(--ink); margin-bottom:4px; }
  .page-sub { color:var(--muted); font-size:14px; margin-bottom:24px; }

  /* ── Tarjetas de métricas (vistas antiguas) ── */
  .metric-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; margin-bottom:32px; }
  .metric-card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:20px; text-align:left; width:100%; color:var(--text); }
  .metric-label { font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; margin-bottom:8px; }
  .metric-val { font-family:var(--mono); font-size:30px; font-weight:600; color:var(--ink); }
  .metric-sub { font-size:12.5px; color:var(--muted); margin-top:4px; }

  .filter-tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .filter-tab { background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:500; color:var(--muted); }
  .filter-tab:hover { color:var(--ink); border-color:rgba(255,255,255,.2); }
  .filter-tab.active { background:var(--raised); color:var(--ink); border-color:rgba(255,90,54,.45); }
  .cat-chip { background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:12px; font-weight:500; color:var(--muted); }
  .cat-chip:hover { border-color:var(--coral); color:var(--coral); }
  .cat-chip.active { background:var(--coral); border-color:var(--coral); color:#fff; }

  /* ── Tablas ── */
  .table-card { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; padding:11px 16px; border-bottom:1px solid var(--line); background:rgba(1,15,31,.6); }
  td { padding:12px 16px; border-bottom:1px solid var(--line-soft); font-size:13.5px; vertical-align:middle; color:var(--text); }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:rgba(26,38,56,.6); }
  .pill { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-family:var(--mono); font-size:11px; font-weight:500; border:1px solid transparent; }
  .pill.on { background:rgba(16,185,129,.12); color:var(--green); border-color:rgba(16,185,129,.25); }
  .pill.off { background:rgba(255,255,255,.04); color:var(--muted); border-color:var(--line); }
  .pill.pending { background:rgba(255,90,54,.12); color:var(--coral); border-color:rgba(255,90,54,.3); }
  .tbl-action { background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:4px; padding:5px 10px; font-size:12.5px; font-weight:500; color:var(--muted); }
  .tbl-action:hover { color:var(--ink); border-color:rgba(255,255,255,.2); }
  .tbl-action:disabled { opacity:.4; cursor:not-allowed; }
  .row-link:hover { color:var(--coral); text-decoration:underline; }

  .btn-primary { background:var(--coral); color:#fff; border:none; border-radius:4px; padding:9px 16px; font-size:13.5px; font-weight:500; white-space:nowrap; }
  .btn-primary:hover { background:var(--coral-dark); box-shadow:0 0 16px rgba(255,90,54,.35); }
  .btn-primary:disabled { opacity:.6; cursor:not-allowed; box-shadow:none; }
  .btn-secondary { background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:4px; padding:9px 16px; font-size:13.5px; font-weight:500; color:var(--muted); }
  .btn-secondary:hover { color:var(--ink); border-color:rgba(255,255,255,.2); }
  .btn-danger { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); color:#EF4444; border-radius:4px; padding:7px 13px; font-size:12.5px; font-weight:500; }
  .btn-danger:hover { background:rgba(239,68,68,.18); }

  .form-card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:20px; }
  .form-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:14px; }
  .form-field label { display:block; font-family:var(--mono); font-size:10.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
  .form-field input, .form-field textarea, .form-field select {
    width:100%; height:36px; border:1px solid var(--line); border-radius:4px; padding:7px 11px; font-size:13.5px; font-family:inherit; background:var(--panel); color:var(--ink);
  }
  .form-field textarea { resize:vertical; min-height:60px; height:auto; }
  .form-field input::placeholder, .form-field textarea::placeholder { color:#475569; }
  .form-field input:focus, .form-field textarea:focus, .form-field select:focus { outline:none; border-color:var(--coral); box-shadow:0 0 0 1px var(--coral); }
  .toggle-row { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line-soft); }
  .toggle-row:last-child { border-bottom:none; }
  .toggle-row strong { color:var(--ink); font-weight:500; }
  .switch { position:relative; width:40px; height:22px; flex-shrink:0; }
  .switch input { opacity:0; width:0; height:0; }
  .switch-track { position:absolute; inset:0; background:#273647; border-radius:999px; transition:background .15s; cursor:pointer; }
  .switch-track:before { content:''; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#F8FAFC; border-radius:50%; transition:transform .15s; }
  .switch input:checked + .switch-track { background:var(--coral); }
  .switch input:checked + .switch-track:before { transform:translateX(18px); }
  .switch input:disabled + .switch-track { opacity:.4; cursor:not-allowed; }

  .back-link { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; font-weight:500; margin-bottom:16px; cursor:pointer; }
  .back-link:hover { color:var(--ink); }
  .section-card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:22px; margin-bottom:18px; }
  .section-title { font-size:16px; font-weight:500; color:var(--ink); margin-bottom:4px; }
  .section-sub { color:var(--muted); font-size:13px; margin-bottom:16px; }

  .dish-card { border:1px solid var(--line); background:rgba(1,15,31,.4); border-radius:6px; padding:14px; margin-bottom:12px; }
  .dish-card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .dish-card-head strong { font-size:14px; color:var(--ink); font-weight:500; }
  .upload-drop { border:1px dashed rgba(255,255,255,.15); border-radius:6px; padding:20px; text-align:center; color:var(--muted); font-size:13px; cursor:pointer; }
  .upload-drop:hover { border-color:var(--coral); background:rgba(255,90,54,.05); }
  .upload-drop.has-video { border-style:solid; border-color:rgba(16,185,129,.35); background:rgba(16,185,129,.06); color:var(--green); }
  .progress-bar-wrap { height:6px; background:#1C2B3C; border-radius:999px; overflow:hidden; margin-top:8px; }
  .progress-bar-fill { height:100%; background:var(--coral); width:0%; transition:width .2s; }
  .empty-row td { text-align:center; color:var(--muted); padding:40px 16px; }
  .loading-txt { color:var(--muted); padding:20px; }

  .photo-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:10px; margin-bottom:14px; }
  .photo-thumb { position:relative; aspect-ratio:4/3; border-radius:6px; overflow:hidden; border:1px solid var(--line); }
  .photo-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .photo-thumb-remove { position:absolute; top:5px; right:5px; width:22px; height:22px; background:rgba(0,0,0,.6); border:none; border-radius:50%; color:#fff; font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .photo-thumb-remove:hover { background:#EF4444; }
  .upload-drop.photo-drop { min-height:80px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .upload-drop.photo-drop svg { width:24px; height:24px; opacity:.45; }

  /* ── Resumen (overview) ── */
  .ov-head { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:-28px -32px 24px; padding:14px 32px; background:rgba(1,15,31,.8); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
  .ov-head h1 { font-size:17px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:8px; }
  .ov-head p { font-size:12px; color:var(--muted); margin-top:2px; }
  .ov-head-actions { display:flex; align-items:center; gap:8px; }
  .ov-chip { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 10px; border-radius:4px; background:var(--panel); border:1px solid var(--line); font-family:var(--mono); font-size:11px; color:var(--text); }
  .ov-icon-btn { width:32px; height:32px; border-radius:4px; display:flex; align-items:center; justify-content:center; background:transparent; border:1px solid transparent; color:var(--muted); }
  .ov-icon-btn:hover { color:var(--ink); background:var(--card-solid); border-color:var(--line); }
  .ov-icon-btn svg { width:18px; height:18px; }
  .ov-icon-btn.spin svg { animation:ovspin .8s linear infinite; }
  @keyframes ovspin { to { transform:rotate(360deg); } }
  .ov-live { display:inline-flex; align-items:center; gap:5px; padding:1px 8px; border-radius:999px; font-family:var(--mono); font-size:10px; font-weight:600; color:var(--coral); background:rgba(255,90,54,.1); border:1px solid rgba(255,90,54,.3); }
  .ov-dot { width:6px; height:6px; border-radius:50%; background:currentColor; display:inline-block; }
  .ov-dot.pulse { animation:ovpulse 1.6s ease-in-out infinite; }
  @keyframes ovpulse { 50% { opacity:.35; } }

  .ov-ribbon { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:10px 16px; border-radius:4px; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--green); margin-bottom:24px; font-size:12.5px; }
  .ov-ribbon.warn { border-left-color:var(--coral); }
  .ov-ribbon strong { font-weight:600; }
  .ov-ribbon .meta { font-family:var(--mono); font-size:10.5px; color:var(--muted); }

  .ov-kpis { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:16px; margin-bottom:24px; }
  @media (max-width:1400px) { .ov-kpis { grid-template-columns:repeat(3, minmax(0,1fr)); } }
  @media (max-width:800px) { .ov-kpis { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  .ov-card { background:var(--card); backdrop-filter:blur(12px); border:1px solid var(--line); border-radius:8px; transition:background .2s, border-color .2s, box-shadow .2s; }
  .ov-kpi { padding:14px; display:flex; flex-direction:column; text-align:left; color:inherit; min-height:150px; }
  button.ov-kpi:hover { background:var(--raised); border-color:rgba(255,90,54,.4); box-shadow:0 0 20px -4px rgba(255,90,54,.15); }
  .ov-kpi-top { display:flex; align-items:flex-start; justify-content:space-between; gap:6px; margin-bottom:6px; }
  .ov-label { font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
  .ov-tag { font-family:var(--mono); font-size:10px; font-weight:500; padding:1px 6px; border-radius:4px; white-space:nowrap; border:1px solid var(--line); color:var(--muted); }
  .ov-tag.coral { color:var(--coral); border-color:rgba(255,90,54,.3); background:rgba(255,90,54,.08); }
  .ov-tag.green { color:var(--green); border-color:rgba(16,185,129,.3); background:rgba(16,185,129,.08); }
  .ov-big { display:flex; align-items:baseline; gap:6px; margin:2px 0 4px; }
  .ov-big .num { font-size:34px; font-weight:600; letter-spacing:-.03em; color:var(--ink); line-height:1.1; }
  .ov-big .of { font-size:12px; color:var(--muted); }
  .ov-kpi .ov-note { font-size:11.5px; color:var(--muted); margin-bottom:10px; }
  .ov-bar { margin-top:auto; height:5px; border-radius:999px; background:#1C2B3C; overflow:hidden; }
  .ov-bar > span { display:block; height:100%; border-radius:999px; background:var(--coral); }
  .ov-bar.green > span { background:var(--green); }
  .ov-spark { margin-top:auto; height:36px; width:100%; display:block; overflow:visible; }

  .ov-split { display:grid; grid-template-columns:minmax(0,8fr) minmax(0,4fr); gap:24px; margin-bottom:24px; align-items:start; }
  @media (max-width:1180px) { .ov-split { grid-template-columns:minmax(0,1fr); } }
  .ov-col { display:flex; flex-direction:column; gap:20px; min-width:0; }
  .ov-panel { padding:20px; }
  .ov-panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding-bottom:12px; margin-bottom:14px; border-bottom:1px solid var(--line-soft); }
  .ov-panel-head h2, .ov-panel-head h3 { font-size:16px; font-weight:500; color:var(--ink); display:flex; align-items:center; gap:8px; letter-spacing:-.01em; }
  .ov-panel-head h2 svg, .ov-panel-head h3 svg { width:18px; height:18px; color:var(--coral); flex-shrink:0; }
  .ov-panel-head p { font-size:12px; color:var(--muted); margin-top:3px; }
  .ov-legend { display:flex; gap:14px; font-family:var(--mono); font-size:10.5px; color:var(--muted); white-space:nowrap; }
  .ov-legend i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; }

  .ov-stats { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin-bottom:14px; }
  @media (max-width:700px) { .ov-stats { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  .ov-stat { padding:10px 12px; border-radius:4px; background:rgba(1,15,31,.6); border:1px solid var(--line-soft); }
  .ov-stat .v { font-family:var(--mono); font-size:20px; font-weight:600; color:var(--ink); margin:2px 0; font-variant-numeric:tabular-nums; }
  .ov-stat .s { font-family:var(--mono); font-size:10px; color:var(--muted); }
  .ov-stat .s.coral { color:var(--coral); }

  .ov-chart { position:relative; height:230px; }
  .ov-chart svg { width:100%; height:100%; display:block; overflow:visible; }
  .ov-tip { position:absolute; pointer-events:none; background:rgba(26,38,56,.96); border:1px solid rgba(255,90,54,.35); border-radius:4px; padding:7px 9px; font-size:12px; white-space:nowrap; display:none; transform:translate(-50%, -100%); }
  .ov-tip .d { font-family:var(--mono); font-size:10px; color:var(--muted); }
  .ov-axis { display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; color:var(--dim); border-top:1px solid var(--line-soft); padding-top:8px; margin-top:6px; }
  .ov-axis .today { color:var(--coral); font-weight:600; }
  .ov-empty-chart { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12.5px; color:var(--muted); }

  .ov-steps { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; }
  @media (max-width:700px) { .ov-steps { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  .ov-step { padding:12px; border-radius:4px; background:var(--panel); border:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  .ov-step.last { border-color:rgba(255,90,54,.35); box-shadow:0 0 16px -6px rgba(255,90,54,.35); }
  .ov-step .k { font-family:var(--mono); font-size:10px; color:var(--muted); display:flex; justify-content:space-between; }
  .ov-step .v { font-family:var(--mono); font-size:16px; font-weight:600; color:var(--ink); }
  .ov-step .d { font-size:12px; color:var(--muted); }
  .ov-step .ov-bar { margin-top:4px; height:4px; }

  .ov-checks { display:flex; flex-direction:column; gap:8px; }
  .ov-check { padding:11px 12px; border-radius:4px; background:var(--panel); border:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .ov-check .l { display:flex; align-items:center; gap:10px; min-width:0; }
  .ov-check .st { width:9px; height:9px; border-radius:50%; flex-shrink:0; }

let HAS_RENDERED_SHELL = false;

async function checkAdminAndInit() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { document.getElementById('login-screen').style.display = 'flex'; return; }

  const { data: adminRow } = await sb.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();

  document.getElementById('login-screen').style.display = 'none';

  document.getElementById('sb-email').textContent = session.user.email;

  // Supabase vuelve a emitir "SIGNED_IN" al recuperar el foco de la

  document.querySelectorAll('#sb-nav a').forEach(a => {

function navigate(view, params) {
  CURRENT_VIEW = view;

  document.querySelectorAll('#sb-nav a').forEach(a => a.classList.toggle('active', a.dataset.view === view));
  if (view === 'restaurants') renderRestaurants(params && params.filter);

  else renderOverview();
}

function navigateToRestaurant(id, skipHashUpdate) {
  CURRENT_VIEW = 'restaurants';
  if (!skipHashUpdate) window.location.hash = `restaurant/${id}`;

/* ── Overview (Resumen) ──
   Diseño "Obsidian Telemetry". Todo lo que se muestra sale de datos reales:
   venues, restaurant_leads, restaurant_page_conversion, venue_page_views,
   venue_events, venue_funnel() y los chequeos find_cron_issues() /
   find_stuck_reservations(). No hay métricas inventadas (latencias, uptime…):
   si un dato no existe, la tarjeta no se muestra. */
const OV_ICONS = {
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>',
  funnel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg>',
  server: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="7" rx="1"/><rect x="3" y="13" width="18" height="7" rx="1"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>',
  pulse: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
  cal: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>',
};
const OV_DOW = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const ovFmt = n => (n == null || Number.isNaN(n)) ? '—' : Number(n).toLocaleString('es-ES');
const ovPct = (a, b) => b ? Math.round((a / b) * 1000) / 10 : null;
function ovAgo(iso) {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'ahora';
  if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `hace ${h} h`;
  const d = Math.round(h / 24);
  if (d < 7) return `hace ${d} d`;
  return new Date(iso).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
}
const ovInitials = name => String(name || '?').replace(/[^\p{L}\p{N} ]/gu, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';

// Curva suave (Catmull-Rom → Bézier) para el gráfico y los minigráficos.
function ovPath(pts) {
  if (!pts.length) return '';
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}
function ovSpark(values, color, id) {
  const W = 120, H = 32, max = Math.max(...values, 1);
  const pts = values.map((v, i) => [Math.round(i * W / Math.max(values.length - 1, 1)), Math.round(H - 3 - (v / max) * (H - 8))]);
  const line = ovPath(pts), last = pts[pts.length - 1];
  return `<svg class="ov-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line} L${W},${H} L0,${H} Z" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="#090D14" stroke="${color}" stroke-width="1.5"/>
  </svg>`;
}

function ovLast7Days() {
  const out = [], now = new Date();
  for (let i = 6; i >= 0; i--) {
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i + 1);
    out.push({ start, end, key: start.toLocaleDateString('en-CA'), label: i === 0 ? 'Hoy' : `${OV_DOW[start.getDay()]} ${String(start.getDate()).padStart(2, '0')}` });
  }
  return out;
}

async function renderOverview() {
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <header class="ov-head">
      <div>
        <h1>Resumen operativo <span class="ov-live"><span class="ov-dot pulse"></span>EN VIVO</span></h1>
        <p>Un vistazo rápido a la actividad del negocio</p>
      </div>
      <div class="ov-head-actions">
        <span class="ov-chip">${OV_ICONS.cal} Últimos 7 días</span>
        <button class="ov-icon-btn" id="ov-refresh" title="Actualizar datos" aria-label="Actualizar datos">${OV_ICONS.refresh}</button>
      </div>
    </header>
    <div id="ov-body"><p class="loading-txt">Cargando datos…</p></div>`;
  document.getElementById('ov-refresh').addEventListener('click', () => {
    document.getElementById('ov-refresh').classList.add('spin');
    renderOverview();
  });

  const days = ovLast7Days();
  const since7 = days[0].start.toISOString();
  const fromKey = days[0].key, toKey = days[6].key;
  const countViews = d => sb.from('venue_page_views').select('id', { count: 'exact', head: true }).gte('viewed_at', d.start.toISOString()).lt('viewed_at', d.end.toISOString());
  const countVideos = d => sb.from('venue_events').select('id', { count: 'exact', head: true }).eq('event', 'video_view').gte('created_at', d.start.toISOString()).lt('created_at', d.end.toISOString());

  const [venuesRes, leads7Res, leadsRes, convRes, cronRes, stuckRes, dishesRes, viewCountsRes, viewDays, videoDays] = await Promise.all([
    sb.from('venues').select('*'),
    sb.from('restaurant_leads').select('id', { count: 'exact', head: true }).gte('created_at', since7),
    sb.from('restaurant_leads').select('restaurant_name, city, created_at', { count: 'exact' }).order('created_at', { ascending: false }).limit(5),
    sb.from('restaurant_page_conversion').select('*').maybeSingle(),
    sb.rpc('find_cron_issues'),
    sb.rpc('find_stuck_reservations'),
    sb.from('menu_videos').select('*'),
    sb.from('venue_view_counts').select('venue_id, views_last_30_days'),
    Promise.all(days.map(countViews)),
    Promise.all(days.map(countVideos)),
  ]);

  const venues = venuesRes.data || [];
  const live = venues.filter(v => !v.archived);
  const active = live.filter(v => v.stripe_charges_enabled);
  const pending = live.filter(v => !v.stripe_charges_enabled);
  const archived = venues.filter(v => v.archived);
  const withVideoAccess = venues.filter(v => v.menu_video_access);
  const dishes = dishesRes.data || [];
  const dishesByVenue = {};
  dishes.forEach(d => { if (d.video_url) dishesByVenue[d.venue_id] = (dishesByVenue[d.venue_id] || 0) + 1; });
  const liveWithDishes = live.filter(v => dishesByVenue[v.id]);
  const views30 = {};
  (viewCountsRes.data || []).forEach(r => { views30[r.venue_id] = r.views_last_30_days; });
  const leads7 = leads7Res.count ?? 0;
  const leadsTotal = leadsRes.count ?? 0;
  const recentLeads = leadsRes.data || [];
  const conv = convRes.data;
  const dailyViews = viewDays.map(r => r.count ?? 0);
  const dailyVideos = videoDays.map(r => r.count ?? 0);
  const trafficOk = !viewDays.some(r => r.error);

  // Embudo de comensales de los últimos 7 días, sumado entre restaurantes activos.
  const funnelRows = await Promise.all(live.map(v => sb.rpc('venue_funnel', { p_venue_id: v.id, p_from: fromKey, p_to: toKey })));
  const funnelOk = funnelRows.length > 0 && funnelRows.every(r => !r.error);
  // Visitas y vídeos salen de los conteos diarios (misma fuente que el gráfico); del embudo solo reservas.
  const F = { booking_starts: 0, bookings: 0, covers_booked: 0 };
  funnelRows.forEach(r => { const row = Array.isArray(r.data) ? r.data[0] : r.data; if (row) Object.keys(F).forEach(k => { F[k] += Number(row[k] || 0); }); });

  // Sidebar badges
  const cv = document.getElementById('sb-count-venues'); if (cv) { cv.textContent = venues.length; cv.hidden = false; }
  const cl = document.getElementById('sb-count-leads'); if (cl) { cl.textContent = leads7; cl.hidden = !leads7; cl.classList.toggle('hot', leads7 > 0); }

  const cronIssues = cronRes.error ? null : (cronRes.data || []);
  const stuck = stuckRes.error ? null : (stuckRes.data || []);
  const problems = (cronIssues ? cronIssues.length : 0) + (stuck ? stuck.length : 0);
  const unknownChecks = cronIssues === null || stuck === null;
  const now = new Date();

  // ── Actividad reciente: leads, restaurantes creados y platos subidos (solo si hay fecha) ──
  const venueName = {}; venues.forEach(v => { venueName[v.id] = v.name; });
  const events = [];
  recentLeads.forEach(l => events.push({ at: l.created_at, color: 'var(--coral)', title: 'Nuevo lead', text: `${l.restaurant_name}${l.city ? ` · ${l.city}` : ''} — desde la landing de restaurantes` }));
  venues.filter(v => v.created_at).forEach(v => events.push({ at: v.created_at, color: 'var(--green)', title: v.name, text: 'Restaurante dado de alta en Una Mesa' }));
  dishes.filter(d => d.created_at && d.video_url).forEach(d => events.push({ at: d.created_at, color: 'var(--cyan)', title: venueName[d.venue_id] || 'Restaurante', text: `Plato con vídeo: ${d.dish_name}` }));
  events.sort((a, b) => new Date(b.at) - new Date(a.at));
  const feed = events.slice(0, 6);

  // ── Tabla: restaurantes más recientes (o por nombre si no hay created_at) ──
  const sorted = [...venues].sort((a, b) => (a.created_at && b.created_at) ? new Date(b.created_at) - new Date(a.created_at) : String(a.name).localeCompare(String(b.name)));
  const tableRows = sorted.slice(0, 5);

  const viewsTotal7 = dailyViews.reduce((a, b) => a + b, 0);
  const videosTotal7 = dailyVideos.reduce((a, b) => a + b, 0);
  const pctActive = live.length ? Math.round(active.length / live.length * 100) : 0;
  const convPct = conv && conv.conversion_pct_total != null ? conv.conversion_pct_total : null;

  const body = document.getElementById('ov-body');
  body.innerHTML = `
    <div class="ov-ribbon ${problems ? 'warn' : ''}">
      <span>${problems
        ? `<strong style="color:var(--coral)">${problems} aviso${problems > 1 ? 's' : ''} del sistema.</strong> Revisa el panel «Salud del sistema».`
        : unknownChecks
          ? `<strong style="color:var(--muted)">No se pudieron ejecutar todos los chequeos.</strong> Revisa el panel «Salud del sistema».`
          : `<strong style="color:var(--green)">Todo en orden.</strong> Sin depósitos atascados ni tareas programadas retrasadas.`}</span>
      <span class="meta">Actualizado ${now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}</span>
    </div>

    <section class="ov-kpis" aria-label="Métricas principales">
      <button class="ov-card ov-kpi" data-nav="restaurants" data-filter="active">
        <div class="ov-kpi-top"><span class="ov-label">Restaurantes activos</span>${archived.length ? `<span class="ov-tag">${archived.length} archivado${archived.length > 1 ? 's' : ''}</span>` : ''}</div>
        <div class="ov-big"><span class="num">${active.length}</span><span class="of">/ ${live.length} en la plataforma</span></div>
        <div class="ov-note">${pctActive}% con pagos activos</div>
        <div class="ov-bar green"><span style="width:${pctActive}%"></span></div>
      </button>
      <button class="ov-card ov-kpi" data-nav="restaurants" data-filter="pending">

function ovDrawChart(el, days, views, videos, ok) {
  if (!el) return;
  if (!ok) { el.innerHTML = '<div class="ov-empty-chart">No se pudieron cargar las visitas.</div>'; return; }
  const W = 800, H = 220, PAD = 12;
  const max = Math.max(...views, ...videos, 1);
  const x = i => Math.round(i * W / (days.length - 1));
  const y = v => Math.round(H - PAD - (v / max) * (H - PAD * 3));
  const pv = views.map((v, i) => [x(i), y(v)]), pd = videos.map((v, i) => [x(i), y(v)]);
  const grid = [0.25, 0.5, 0.75, 1].map(f => { const yy = Math.round(H - PAD - f * (H - PAD * 3)); return `<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="rgba(255,255,255,.05)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>`; }).join('');
  el.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Visitas y vídeos vistos por día">
      <defs>
        <linearGradient id="ov-a1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#FF5A36" stop-opacity=".32"/><stop offset="95%" stop-color="#FF5A36" stop-opacity="0"/></linearGradient>
        <linearGradient id="ov-a2" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#FFB4A3" stop-opacity=".2"/><stop offset="95%" stop-color="#FFB4A3" stop-opacity="0"/></linearGradient>
      </defs>
      ${grid}
      <path d="${ovPath(pd)} L${W},${H} L0,${H} Z" fill="url(#ov-a2)"/>
      <path d="${ovPath(pd)}" fill="none" stroke="#FFB4A3" stroke-width="2.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <path d="${ovPath(pv)} L${W},${H} L0,${H} Z" fill="url(#ov-a1)"/>
      <path d="${ovPath(pv)}" fill="none" stroke="#FF5A36" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 6px rgba(255,90,54,.5))"/>
    </svg>
    ${pv.map((p, i) => `<span style="position:absolute;left:${p[0] / W * 100}%;top:${p[1] / H * 100}%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:${i === 6 ? '#fff' : '#FF5A36'};border:2px solid ${i === 6 ? '#FF5A36' : '#090D14'}"></span>`).join('')}
    <div class="ov-tip" id="ov-tip"></div>
    ${days.map((d, i) => `<span data-i="${i}" style="position:absolute;top:0;bottom:0;left:${(i - 0.5) / (days.length - 1) * 100}%;width:${100 / (days.length - 1)}%"></span>`).join('')}`;
  if (max === 1 && !views.some(Boolean) && !videos.some(Boolean)) {
    el.insertAdjacentHTML('beforeend', '<div class="ov-empty-chart">Sin visitas en los últimos 7 días.</div>');
  }
  const tip = el.querySelector('#ov-tip');
  el.querySelectorAll('[data-i]').forEach(zone => {
    zone.addEventListener('mouseenter', () => {
      const i = Number(zone.dataset.i);
      tip.innerHTML = `<div class="d">${days[i].label === 'Hoy' ? 'Hoy' : days[i].start.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'short' })}</div><div style="color:#FF5A36;font-weight:600">${ovFmt(views[i])} visitas</div><div style="color:#FFB4A3;font-family:var(--mono);font-size:11px">${ovFmt(videos[i])} vídeos vistos</div>`;
      tip.style.left = `${Math.min(Math.max(pv[i][0] / W * 100, 10), 90)}%`;
      tip.style.top = `${Math.max(pv[i][1] / H * 100 - 4, 18)}%`;
      tip.style.display = 'block';
    });
    zone.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  });
}

/* ── Restaurantes ── */
const FILTER_LABELS = {
  all: 'Todos', active: 'Activos', pending: 'Pendientes de Stripe',
  archived: 'Archivados', menuvideo: 'Con menú en video', backofhouse: 'Con backofhouse',
};

const escHtml = (str) => String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function renderRestaurants(initialFilter) {
  let currentFilter = initialFilter || 'all';
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div style="display:flex; align-items:flex-start; justify-content:space-between;">
      <div>
        <div class="page-title">Restaurantes</div>
        <div class="page-sub">Todos los restaurantes conectados a Una Mesa</div>
      </div>
      <button class="btn-primary" id="new-venue-btn">+ Nuevo restaurante</button>
    </div>
    <div id="new-venue-form-wrap"></div>
    <div class="filter-tabs" id="filter-tabs"></div>
    <div class="table-card">
      <table>
        <thead><tr><th>Nombre</th><th>Ciudad</th><th>Stripe</th><th>Estado</th><th>Menú en video</th><th>Backofhouse</th><th></th></tr></thead>
        <tbody id="venues-tbody"><tr class="empty-row"><td colspan="7">Cargando…</td></tr></tbody>
      </table>
    </div>
  `;

  document.getElementById('new-venue-btn').addEventListener('click', () => {
    const wrap = document.getElementById('new-venue-form-wrap');
    wrap.innerHTML = `
      <div class="form-card" style="margin-bottom:20px;">
        <div class="form-row">
          <div class="form-field"><label>Nombre del restaurante</label><input type="text" id="nv-name" placeholder="Ej. The Thames Table"></div>
          <div class="form-field"><label>Ciudad</label><input type="text" id="nv-city" placeholder="Ej. London"></div>
        </div>
        <div style="display:flex; gap:8px; margin-top:14px;">
          <button class="btn-primary" id="nv-save">Crear restaurante</button>
          <button class="tbl-action" id="nv-cancel">Cancelar</button>
        </div>
        <p id="nv-error" style="color:var(--red); font-size:13px; margin-top:8px;"></p>
      </div>
    `;
    document.getElementById('nv-cancel').addEventListener('click', () => { wrap.innerHTML = ''; });
    document.getElementById('nv-save').addEventListener('click', async () => {
      const name = document.getElementById('nv-name').value.trim();
      const city = document.getElementById('nv-city').value.trim();
      if (!name) { document.getElementById('nv-error').textContent = 'El nombre es obligatorio.'; return; }
      const { data: newVenue, error: insErr } = await sb.from('venues').insert({ name, city: city || null, archived: false }).select('id').single();
      if (insErr) { document.getElementById('nv-error').textContent = insErr.message; return; }
      navigateToRestaurant(newVenue.id);
    });
  });

  const [{ data, error }, { data: ruRows, error: ruErr }] = await Promise.all([
    sb.from('venues')
      .select('*') // '*' so the list still loads before migration 043 adds backofhouse_hidden_modules
      .order('name'),
    sb.from('restaurant_users').select('venue_id, email'),
  ]);
  // venue_id → [emails] of backofhouse logins (needs migration 043 for admins to read it)
  const bohLogins = {};
  (ruRows || []).forEach(r => { (bohLogins[r.venue_id] = bohLogins[r.venue_id] || []).push(r.email); });

  const allData = data || [];

  const applyFilter = (filter) => {
    if (filter === 'active') return allData.filter(v => !v.archived && v.stripe_charges_enabled);
    if (filter === 'pending') return allData.filter(v => !v.archived && !v.stripe_charges_enabled);
    if (filter === 'archived') return allData.filter(v => v.archived);
    if (filter === 'menuvideo') return allData.filter(v => v.menu_video_access);
    if (filter === 'backofhouse') return allData.filter(v => bohLogins[v.id]);
    return allData;
  };

  const renderTabs = () => {
    const tabs = document.getElementById('filter-tabs');
    tabs.innerHTML = Object.keys(FILTER_LABELS).map(f =>
      `<button class="filter-tab${f === currentFilter ? ' active' : ''}" data-filter="${f}">${FILTER_LABELS[f]}</button>`
    ).join('');
    tabs.querySelectorAll('[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => { currentFilter = btn.dataset.filter; renderTabs(); renderRows(); });
    });
  };

  const renderRows = () => {
    const tbody = document.getElementById('venues-tbody');
    if (error || allData.length === 0) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="7">${error ? 'Error al cargar' : 'Sin restaurantes todavía'}</td></tr>`;
      return;
    }
    const filtered = applyFilter(currentFilter);
    if (filtered.length === 0) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="7">Ningún restaurante en esta categoría</td></tr>`;
      return;
    }
    tbody.innerHTML = filtered.map(v => `
      <tr data-id="${v.id}">
        <td><strong class="row-link" data-open="${v.id}" style="cursor:pointer;">${v.name}</strong></td>
        <td>${v.city || '—'}</td>
        <td>${v.stripe_charges_enabled
          ? '<span class="pill on">Conectado</span>'
          : '<span class="pill pending">Pendiente</span>'}</td>
        <td>${v.archived
          ? '<span class="pill off">Archivado</span>'
          : '<span class="pill on">Activo</span>'}</td>
        <td>${v.menu_video_access
          ? '<span class="pill on">Sí</span>'
          : '<span class="pill off">No</span>'}</td>
        <td>${ruErr
          ? '<span class="pill off" title="Aplica la migración 043 para ver este dato">—</span>'
          : bohLogins[v.id]
            ? `<span class="pill on" title="${escHtml(bohLogins[v.id].join(', '))}">Sí${(v.backofhouse_hidden_modules || []).length ? ` · ${v.backofhouse_hidden_modules.length} ocultos` : ''}</span>`
            : '<span class="pill off">No</span>'}</td>
        <td>
          <button class="tbl-action" data-open="${v.id}">Editar</button>
          <button class="tbl-action" data-action="toggle-archive" data-id="${v.id}" data-archived="${v.archived}">
            ${v.archived ? 'Reactivar' : 'Archivar'}
          </button>
        </td>
      </tr>
    `).join('');

    tbody.querySelectorAll('[data-open]').forEach(el => {
      el.addEventListener('click', () => navigateToRestaurant(el.dataset.open));
    });

    tbody.querySelectorAll('[data-action="toggle-archive"]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const currentlyArchived = btn.dataset.archived === 'true';
        btn.disabled = true;
        btn.textContent = '...';
        const { error: updErr } = await sb.from('venues').update({ archived: !currentlyArchived }).eq('id', id);
        if (updErr) { alert('Error: ' + updErr.message); btn.disabled = false; return; }
        renderRestaurants(currentFilter);
      });
    });
  };

  renderTabs();
  renderRows();
}

const BOH_MODULES = [
  { id: 'panel',     label: 'Panel',       sub: 'Resumen del día' },
  { id: 'reservas',  label: 'Reservas',    sub: 'Lista y timeline de reservas' },
  { id: 'tpv',       label: 'TPV',         sub: 'Punto de venta y cobros' },

async function initBackofhouseSection(venue) {
  const accessEl = document.getElementById('boh-access');
  const { data: logins, error: ruErr } = await sb.from('restaurant_users').select('email').eq('venue_id', venue.id);
  if (ruErr) accessEl.innerHTML = '<span class="pill off">—</span> No se pudo comprobar el acceso (¿migración 043 aplicada?).';
  else if (!logins || logins.length === 0) accessEl.innerHTML = '<span class="pill off">Sin acceso</span> Este restaurante no tiene ninguna cuenta del backofhouse vinculada.';
  else accessEl.innerHTML = `<span class="pill on">Con acceso</span> Cuenta${logins.length > 1 ? 's' : ''}: <strong>${logins.map(l => escHtml(l.email)).join(', ')}</strong>`;

  const hasColumn = 'backofhouse_hidden_modules' in venue;
  const hidden = new Set(venue.backofhouse_hidden_modules || []);
  const wrap = document.getElementById('boh-modules');
  wrap.innerHTML = BOH_MODULES.map(m => `
    <div class="toggle-row">
      <div><strong>${m.label}</strong><br><span class="page-sub" style="margin:0;">${m.sub}</span></div>
      <label class="switch"><input type="checkbox" data-boh-module="${m.id}" ${hidden.has(m.id) ? '' : 'checked'} ${hasColumn ? '' : 'disabled'}><span class="switch-track"></span></label>
    </div>`).join('');

  const btn = document.getElementById('boh-save');
  const msg = document.getElementById('boh-msg');
  if (!hasColumn) {
    btn.disabled = true;
    msg.style.color = 'var(--red)';
    msg.textContent = 'Aplica la migración 043 en Supabase para poder guardar.';
    return;
  }
  btn.addEventListener('click', async () => {
    const newHidden = [...wrap.querySelectorAll('[data-boh-module]')].filter(cb => !cb.checked).map(cb => cb.dataset.bohModule);
    if (newHidden.length === BOH_MODULES.length) {
      msg.style.color = 'var(--red)'; msg.textContent = 'Deja al menos un módulo visible.'; return;
    }
    btn.disabled = true;
    const { error: updErr } = await sb.from('venues').update({ backofhouse_hidden_modules: newHidden }).eq('id', venue.id);
    btn.disabled = false;
    msg.style.color = updErr ? 'var(--red)' : 'var(--green)';
    msg.textContent = updErr ? 'Error: ' + updErr.message : '✓ Guardado — el restaurante lo verá al recargar el panel';
    setTimeout(() => { msg.textContent = ''; }, 4000);
  });
}

function renderCategoryOrder(venue, dishes) {
  const wrap = document.getElementById('category-order-list');
  const realCats = [...new Set(dishes.map(d => d.category))];

  let order;
  if (venue.category_order) {
    const saved = venue.category_order.split(',').map(s => s.trim()).filter(Boolean);
    const savedThatStillExist = saved.filter(c => realCats.includes(c));
    const newOnes = realCats.filter(c => !saved.includes(c));
    order = [...savedThatStillExist, ...newOnes];
  } else {
    const standardPresent = STANDARD_CATEGORIES.filter(c => realCats.includes(c));
    const extras = realCats.filter(c => !STANDARD_CATEGORIES.includes(c));
    order = [...standardPresent, ...extras];
  }

  const renderList = () => {
    if (order.length === 0) {
      wrap.innerHTML = `<p class="page-sub">Agrega platos abajo para poder ordenar sus categorías.</p>`;
      return;
    }
    wrap.innerHTML = order.map((cat, i) => `
      <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line);">
        <span style="font-weight:600; font-size:13.5px;">${cat}</span>
        <div style="display:flex; gap:4px;">
          <button class="tbl-action" data-move="up" data-idx="${i}" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="tbl-action" data-move="down" data-idx="${i}" ${i === order.length - 1 ? 'disabled' : ''}>↓</button>
        </div>
      </div>
    `).join('');

    wrap.querySelectorAll('[data-move]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const idx = Number(btn.dataset.idx);
        const swapWith = btn.dataset.move === 'up' ? idx - 1 : idx + 1;
        [order[idx], order[swapWith]] = [order[swapWith], order[idx]];
        renderList();
        await sb.from('venues').update({ category_order: order.join(',') }).eq('id', venue.id);
      });
    });
  };

  renderList();
  // Guarda el orden inicial detectado si el restaurante todavía no tenía uno guardado.
  if (!venue.category_order && order.length > 0) {
    sb.from('venues').update({ category_order: order.join(',') }).eq('id', venue.id);
  }
}

    <div class="dish-card">
      <div class="dish-card-head">
        <strong>${d.dish_name} <span style="color:var(--muted); font-weight:600;">— ${d.category}</span></strong>

          <button class="tbl-action" data-edit="${d.id}">Editar</button>

  // ── Venue photo upload ──────────────────────────────────────────
  function initPhotoSection(venueId, photoUrls) {
    let photos = Array.isArray(photoUrls) ? [...photoUrls] : [];
    let dirty = false;

    function renderGrid() {
      const grid = document.getElementById('photos-grid');
      if (!grid) return;
      grid.innerHTML = '';
      photos.forEach((url, idx) => {
        const thumb = document.createElement('div');
        thumb.className = 'photo-thumb';
        thumb.innerHTML = `<img src="${url}" loading="lazy"><button class="photo-thumb-remove" data-idx="${idx}" title="Quitar foto">×</button>`;
        grid.appendChild(thumb);
      });
      const drop = document.getElementById('photos-drop');
      const dropLabel = document.getElementById('photos-drop-label');
      const saveBtn = document.getElementById('save-photos-btn');
      if (drop) drop.style.display = photos.length >= 10 ? 'none' : 'flex';
      if (dropLabel) dropLabel.textContent = photos.length === 0 ? 'Haz clic para elegir fotos' : `Agregar más (${10 - photos.length} restantes)`;
      if (saveBtn) saveBtn.style.display = dirty ? 'inline-block' : 'none';
    }

    renderGrid();

    const drop = document.getElementById('photos-drop');
    const fileInput = document.getElementById('photos-file-input');
    const saveBtn = document.getElementById('save-photos-btn');
    const photosMsg = document.getElementById('photos-msg');
    const grid = document.getElementById('photos-grid');

    if (!drop || !fileInput || !saveBtn || !photosMsg || !grid) return;

    drop.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      const remaining = 10 - photos.length;
      if (remaining <= 0) { photosMsg.textContent = 'Ya hay 10 fotos — quita alguna antes.'; return; }
      const toUpload = files.slice(0, remaining);
      if (files.length > remaining) photosMsg.textContent = `Solo se subirán ${remaining} foto(s) — máximo 10.`;
      else photosMsg.textContent = '';

      drop.style.opacity = '0.5';
      drop.style.pointerEvents = 'none';
      photosMsg.style.color = 'var(--muted)';
      photosMsg.textContent = 'Subiendo…';

      const { data: sessionData } = await sb.auth.getSession();
      const token = sessionData?.session?.access_token;
      if (!token) { photosMsg.textContent = 'Sin sesión.'; drop.style.opacity = '1'; drop.style.pointerEvents = ''; return; }

      for (const file of toUpload) {
        try {
          const base64 = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
          const res = await fetch('https://rkaytcmyaaighozxatod.supabase.co/functions/v1/upload-venue-photo', {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ file_base64: base64, content_type: file.type }),
          });
          const json = await res.json();
          if (!res.ok || !json.success) throw new Error(json.error || 'Error al subir');
          photos.push(json.url);
          dirty = true;
          renderGrid();
        } catch (err) {
          photosMsg.textContent = err.message || 'Error al subir una foto.';
          photosMsg.style.color = 'var(--red)';
        }
      }

      drop.style.opacity = '1';
      drop.style.pointerEvents = '';
      if (!photosMsg.textContent || photosMsg.textContent === 'Subiendo…') photosMsg.textContent = '';
      fileInput.value = '';
    });

    grid.addEventListener('click', (e) => {
      const btn = e.target.closest('.photo-thumb-remove');
      if (!btn) return;
      const idx = parseInt(btn.dataset.idx, 10);
      photos.splice(idx, 1);
      dirty = true;
      renderGrid();
    });

    saveBtn.addEventListener('click', async () => {
      saveBtn.disabled = true;
      photosMsg.textContent = 'Guardando…';
      photosMsg.style.color = 'var(--muted)';
      const { error } = await sb.from('venues').update({ photo_urls: photos.length ? photos : null }).eq('id', venueId);
      saveBtn.disabled = false;
      if (error) {
        photosMsg.textContent = error.message;
        photosMsg.style.color = 'var(--red)';
      } else {
        dirty = false;
        photosMsg.textContent = 'Fotos guardadas ✓';
        photosMsg.style.color = 'var(--green)';
        saveBtn.style.display = 'none';
        setTimeout(() => { photosMsg.textContent = ''; }, 3000);
      }
    });
  }

</script>
